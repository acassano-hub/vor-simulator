<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VOR / HSI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      background:#0c0d11;
      color:#cdd0d8;
      font-family:-apple-system,'Helvetica Neue',sans-serif;
      width:100vw;
      height:100vh;           /* fallback */
      height:100dvh;          /* iOS Safari: excluye barra URL y tabs */
      overflow:hidden;
    }

    /* ══════════════════════════════
       LAYOUT VERTICAL (v6.00)
       Rosa en el 45 % superior; abajo dos columnas de 5 rectángulos
       (I1–I5 a la izquierda, D1–D5 a la derecha)
    ══════════════════════════════ */
    .screen {
      width:100%; height:100%;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    #screen-main {
      padding:env(safe-area-inset-top) env(safe-area-inset-right)
              env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .rosa-zona { position:relative; flex:0 0 45%; min-height:0; }
    .hsi-container {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
    }
    #hsi { display:block; width:100%; height:100%; }
    .ov {
      position:absolute; z-index:5; pointer-events:none;
      font-family:'Courier New',monospace; font-weight:700; line-height:1; white-space:nowrap;
    }
    .ov-lbl { font-size:30px; }
    .ov-val { font-size:40px; }
    #tofrom-text  { top:2px; left:6px; font-size:30px; color:#333; letter-spacing:1px; }
    #gps-top      { top:6px; left:50%; transform:translateX(-50%); font-size:18px; color:#ff5555; display:none; }
    /* NAV1 activo (sólo modo VOR): tocarlo abre la lista para cambiarlo */
    #nav1-badge {
      top:2px; right:6px; font-size:30px; color:#f0c040; background:#1a1500;
      border:2px solid #f0c040; border-radius:8px; padding:3px 10px;
      pointer-events:auto; cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    #nav1-badge:active { filter:brightness(1.4); }
    #trk-overlay  { left:6px;  bottom:2px; color:#fff; }
    #radial-overlay { right:6px; bottom:2px; color:#f0c040; }
    #app-ver {
      left:50%; bottom:1px; transform:translateX(-50%);
      font-size:10px; color:#888; font-weight:400;
    }

    .grilla {
      flex:1; min-height:0;
      display:grid; grid-template-columns:1fr 1fr;
      grid-template-rows:repeat(5, minmax(0, 1fr)); grid-auto-flow:column;
      gap:6px; padding:6px;
    }
    .slot {
      position:relative; min-width:0; min-height:0; overflow:hidden;
      border:1px solid #a8adb8; border-radius:10px; color:#fff;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font-family:'Courier New',monospace;
      cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    }
    .slot-tag  { font-size:26px; font-weight:700; letter-spacing:1px; line-height:1; white-space:nowrap; }
    .slot-val  { font-size:40px; font-weight:700; line-height:0.82; white-space:nowrap; }
    .slot-sub  { font-size:32px; font-weight:700; line-height:0.9; white-space:nowrap; }
    .slot-mini { position:absolute; right:8px; top:4px; font-size:16px; font-weight:700; letter-spacing:1px; line-height:1; }
    .slot-tag:empty, .slot-sub:empty, .slot-mini:empty, .slot-val:empty { display:none; }
    .slot.btn .slot-val { letter-spacing:2px; }
    .slot:not(.vacio):active { filter:brightness(1.35); }

    /* Colores de cada dato (borde y texto) */
    .slot.vacio   { border-color:#3a3d4a; cursor:default; }
    .slot.c-yel   { border-color:#f0c040; color:#f0c040; }
    .slot.c-dme-v { border-color:#f0c040; }
    .slot.c-dme-r { border-color:#00e5ff; }
    .slot.c-dme-v .slot-val, .slot.c-dme-r .slot-val { color:#ff5555; }
    .slot.c-wht   { border-color:#fff; }
    .slot.c-cyan  { border-color:#00e5ff; color:#00e5ff; }
    .slot.c-next  { border-color:#00e5ff; }
    .slot.c-next .slot-tag { color:#cdd0d8; }
    .slot.c-next .slot-val { color:#00e5ff; font-weight:400; }
    .slot.c-brown { border:2px solid #d08a4a; background:rgba(70,34,12,0.3); color:#d08a4a; }
    .slot.c-green { border-color:#8cff8c; color:#8cff8c; }
    .slot.c-mag   { border-color:#d060ff; color:#d060ff; }
    .slot.c-pink  { border-color:#ff8fc8; color:#ff8fc8; }
    .slot.c-mag-on  { border-color:#28d858; color:#28d858; }   /* fin de la cuenta: titila */
    .slot.c-mag-off { border-color:#1a0a22; color:#1a0a22; }
    /* Botones */
    .slot.b-vor     { border:2px solid #f0c040; background:#1a1500; color:#f0c040; }
    .slot.b-rte     { border:2px solid #00e5ff; background:#00e5ff; color:#000; }
    .slot.b-hold, .slot.b-dat { border:2px solid #d060ff; background:#111318; color:#d060ff; }
    .slot.b-hold-on { border:2px solid #d060ff; background:#d060ff; color:#000; }

    /* ════ TECLADO NUMÉRICO (vertical) ════ */
    #screen-kbd {
      gap:8px;
      padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
              calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    }
    .kbd-side { display:contents; }
    .kbd-grid {
      order:1; flex:1; min-height:0;
      display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(4, 1fr);
      gap:8px;
    }
    .kbd-row { order:2; flex:0 0 78px; display:flex; gap:8px; }
    .kbd-key {
      flex:1; min-width:0;
      background:#1a1d26; border:1px solid #3a3d4a; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:44px; font-weight:700; color:#fff;
      font-family:'Courier New',monospace;
      cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    .kbd-key:active { background:#3a3d4a; }
    .kbd-key.off    { visibility:hidden; }
    .kbd-key.act    { font-size:34px; color:#f0c040; border-color:#f0c040; background:#1a1500; }
    .kbd-key.turn   { color:#d060ff; border-color:#d060ff; background:#1a0a22; }
    .kbd-key.ok     { background:#1f4e79; border-color:#4a8ad0; }
    .kbd-key.ok:active { background:#2a6aa8; }
    .kbd-key.cancel { font-size:30px; color:#aaa; }
    .kbd-head {
      order:0; flex:0 0 auto; min-height:118px;
      display:flex; flex-direction:column; justify-content:center;
      border:2px solid #f0c040; border-radius:12px; padding:4px 12px;
      font-family:'Courier New',monospace;
    }
    #kbd-title { font-size:20px; font-weight:700; color:#f0c040; letter-spacing:1px; }
    #kbd-disp  { font-size:60px; font-weight:700; color:#fff; line-height:1; letter-spacing:4px; }
    #kbd-disp.prev { color:#555; }
    #kbd-disp.err  { color:#ff4444; }
    #kbd-msg { font-size:15px; color:#ff4444; min-height:17px; }

    /* ── Route picker overlay ── */
    #rte-overlay {
      position:fixed; inset:0; z-index:8000;
      background:#0c0d11ee;
      display:flex; flex-direction:column;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap:8px;
    }
    .rte-card {
      width:100%; max-width:420px;
      background:#141620; border:1px solid #2a2f40; border-radius:10px;
      padding:12px 16px; cursor:pointer;
      display:flex; flex-direction:column; gap:4px;
    }
    .rte-card:active { background:#1f2535; }
    .rte-card-nombre { font-size:17px; font-weight:700; color:#f0c040; font-family:'Courier New',monospace; }
    .rte-card-fecha  { font-size:12px; color:#8a8f9a; font-family:'Courier New',monospace; }
    .rte-close {
      font-size:15px; color:#888; cursor:pointer; margin-top:8px;
      padding:6px 20px; border:1px solid #333; border-radius:6px;
    }
    .rte-scan {
      width:100%; max-width:420px; box-sizing:border-box;
      background:#0d1a1f; border:2px solid #00e5ff; border-radius:10px;
      padding:14px 16px; cursor:pointer; text-align:center;
      font-size:20px; font-weight:700; color:#00e5ff; font-family:'Courier New',monospace;
      user-select:none; -webkit-user-select:none;
    }
    .rte-scan:active { background:#163038; }
    /* ── Escáner de QR ── */
    #qr-overlay {
      position:fixed; inset:0; z-index:9500; background:#000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:'Courier New',monospace;
    }
    #qr-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #qr-marco {
      position:relative; width:70vmin; height:70vmin;
      border:3px solid #00e5ff; border-radius:14px;
      box-shadow:0 0 0 100vmax #000a; pointer-events:none;
    }
    #qr-estado {
      position:absolute; top:calc(env(safe-area-inset-top) + 20px); left:16px; right:16px;
      text-align:center; color:#cdd0d8; font-size:16px; font-weight:700;
    }
    #qr-cerrar {
      position:absolute; bottom:calc(env(safe-area-inset-bottom) + 24px);
      font-size:22px; font-weight:700; color:#cdd0d8; cursor:pointer;
      padding:12px 30px; border:2px solid #555; border-radius:10px; background:#111318;
      user-select:none; -webkit-user-select:none;
    }
    /* ════ CONFIGURACIÓN (tocando la rosa en modo VOR) ════ */
    #screen-config {
      gap:14px;
      padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
              calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      font-family:'Courier New',monospace;
    }
    .cfg-tit { font-size:28px; font-weight:700; color:#cdd0d8; letter-spacing:2px; text-align:center; padding:8px 0; }
    .cfg-op {
      flex:0 0 104px; border:2px solid #ff9900; border-radius:12px; background:#1e2028;
      display:flex; align-items:center; justify-content:space-between; padding:0 22px;
      cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    .cfg-op:active { filter:brightness(1.35); }
    .cfg-op .n { font-size:40px; font-weight:700; color:#ff9900; }
    .cfg-op .v { font-size:54px; font-weight:700; color:#fff; }
    .cfg-op.vor { border-color:#f0c040; }
    .cfg-op.vor .n { color:#f0c040; }
    .btn-volver {
      margin-top:auto; flex:0 0 88px; border:2px solid #555; border-radius:12px; background:#111318;
      display:flex; align-items:center; justify-content:center;
      font-size:32px; font-weight:700; color:#cdd0d8; font-family:'Courier New',monospace;
      cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    .btn-volver:active { background:#2a2d38; }

    /* ════ DAT: estima a cada WP de la ruta ════ */
    #screen-wp-est {
      padding:env(safe-area-inset-top) env(safe-area-inset-right)
              env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family:'Courier New',monospace;
    }
    .dat-head { display:flex; gap:8px; padding:8px; flex-shrink:0; }
    .dat-head .btn-volver { margin-top:0; flex:1; height:70px; font-size:28px; }
    .dat-head .rutas { border-color:#00e5ff; color:#00e5ff; background:#0d1a1f; }
    #wp-est-list {
      flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:0 8px 8px; display:flex; flex-direction:column; gap:8px;
    }
    .wpe { border:2px solid #3a3d4a; border-radius:12px; background:#141620; padding:8px 14px; cursor:pointer; flex-shrink:0; }
    .wpe .n { display:flex; justify-content:space-between; align-items:baseline; }
    .wpe .wp { font-size:44px; color:#f0c040; }
    .wpe .ix { font-size:20px; color:#8a8f9a; font-weight:700; }
    .wpe .t  { display:flex; justify-content:space-between; margin-top:4px; }
    .wpe .t div { display:flex; flex-direction:column; }
    .wpe .t div + div { align-items:flex-end; }
    .wpe .l  { font-size:16px; font-weight:700; color:#8a8f9a; letter-spacing:1px; }
    .wpe .v  { font-size:48px; font-weight:700; color:#fff; line-height:1; }
    .wpe.act { border-color:#00e5ff; background:#0d1a1f; }
    .wpe.act .wp { color:#00e5ff; }
    .wpe.pas { opacity:.45; }

    /* ════ SETTINGS SCREEN ════ */
    .settings-header {
      width:100%; display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-bottom:1px solid #18191f;
      flex-shrink:0;
    }
    .btn-back {
      background:none; border:none; color:#5a8acc;
      font-size:38px; cursor:pointer;
      padding:6px 10px 6px 0;
      display:flex; align-items:center; gap:5px;
    }
    .settings-title {
      font-size:28px; color:#777; letter-spacing:2px;
      font-family:'Courier New',monospace;
    }
    .settings-body {
      width:100%; padding:10px;
      display:flex; flex-direction:column;
      overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1;
    }
    .vor-cards { display:flex; flex-direction:column; gap:8px; }
    .vor-card {
      display:flex; align-items:center;
      padding:14px 16px; background:#141618;
      border:1px solid #202228; border-radius:12px;
      cursor:pointer; gap:12px;
    }
    .vor-card.active { background:#0b1e38; border-color:#2a5590; }
    .vor-card-dot { width:9px; height:9px; border-radius:50%; background:#252830; flex-shrink:0; }
    .vor-card.active .vor-card-dot { background:#3ac060; }
    .vor-card-main { flex:1; }
    .vor-card-id { font-size:40px; font-weight:700; font-family:'Courier New',monospace; color:#cdd0d8; letter-spacing:2px; }
    .vor-card.active .vor-card-id { color:#7eb8f7; }
    .vor-card-name { font-size:22px; color:#888; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .vor-card-main { min-width:0; }
    .vor-card-cat  { font-size:15px; font-weight:700; padding:1px 6px; border:1px solid; border-radius:5px;
                     margin-left:10px; vertical-align:middle; letter-spacing:0; white-space:nowrap; }
    .vor-card-id { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cat-VOR { color:#f0c040; } .cat-NDB { color:#ff9900; } .cat-AD { color:#cdd0d8; } .cat-FIX { color:#8a8f9a; }
    #screen-settings {
      padding:env(safe-area-inset-top) env(safe-area-inset-right)
              env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .nav-filtros { padding:8px 10px 0; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
    #nav-buscar {
      width:100%; font-size:26px; font-weight:700; font-family:'Courier New',monospace;
      padding:10px 14px; border-radius:10px; border:2px solid #4a5568; background:#141618; color:#fff;
      text-transform:uppercase; -webkit-appearance:none; appearance:none;
    }
    #nav-buscar::placeholder { text-transform:none; font-size:20px; font-weight:400; color:#666; }
    .nav-chips { display:flex; gap:8px; }
    .chip {
      flex:1; text-align:center; padding:10px 0; border-radius:10px; border:2px solid #3a3d4a; color:#666;
      font-size:22px; font-weight:700; font-family:'Courier New',monospace;
      cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    .chip.on { border-color:#00e5ff; color:#00e5ff; background:#0d1a1f; }
    .nav-nota { text-align:center; color:#777; font-size:18px; padding:10px; font-family:'Courier New',monospace; }
    .vor-card-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
    .vor-card-brg { font-size:22px; font-family:'Courier New',monospace; color:#00e5ff; letter-spacing:1px; }
    .vor-card-dme { font-size:22px; font-family:'Courier New',monospace; color:#ff5555; }
    .vor-card-dme-nm { font-size:14px; color:#555; }
  </style>
</head>
<body>

<!-- ══════════════════ PANTALLA PRINCIPAL ══════════════════ -->
<div id="screen-main" class="screen">

  <!-- 45 % superior: rosa (tocándola en modo VOR → configuración) -->
  <div class="rosa-zona" onclick="roseTap()">
    <div class="hsi-container">
      <svg id="hsi" viewBox="8 8 284 284">
        <defs>
          <clipPath id="clip">
            <circle cx="150" cy="150" r="141"/>
          </clipPath>
        </defs>
        <rect x="0" y="0" width="300" height="300" fill="#090a0d"/>

        <g clip-path="url(#clip)">

          <circle cx="150" cy="150" r="149" fill="#090a0d"/>

          <!-- ① Rosa de compass -->
          <g id="g-compass"></g>

          <!-- ③ RMI — aguja doble barra verde -->
          <!-- Rumbo a un 2.º punto: en RTE el WP después del NEXT (cyan), en VOR el NAV2 (rosado).
               Punta de flecha sobre el bisel, apuntando hacia afuera -->
          <g id="g-brg2" style="display:none">
            <polygon id="brg2-tri" points="150,11 141,28 159,28" fill="#00e5ff" stroke="#000" stroke-width="1" opacity="0.9"/>
          </g>

          <g id="g-rmi">
            <polygon points="150,50 142,72 150,82 158,72" fill="#28d858"/>
            <line x1="143" y1="71" x2="143" y2="150" stroke="#28d858" stroke-width="2.5"/>
            <line x1="157" y1="71" x2="157" y2="150" stroke="#28d858" stroke-width="2.5"/>
            <line x1="140" y1="150" x2="160" y2="150" stroke="#28d858" stroke-width="2"/>
            <line x1="143" y1="150" x2="143" y2="208" stroke="#28d858" stroke-width="2" opacity="0.5"/>
            <line x1="157" y1="150" x2="157" y2="208" stroke="#28d858" stroke-width="2" opacity="0.5"/>
            <line x1="140" y1="204" x2="160" y2="204" stroke="#28d858" stroke-width="2" opacity="0.5"/>
          </g>

          <!-- ④ Course bar + CDI -->
          <g id="g-course">
            <line x1="150" y1="62" x2="150" y2="238" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <line x1="95"  y1="143" x2="95"  y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="106" y1="143" x2="106" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="117" y1="143" x2="117" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="128" y1="143" x2="128" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="139" y1="143" x2="139" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="161" y1="143" x2="161" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="172" y1="143" x2="172" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="183" y1="143" x2="183" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="194" y1="143" x2="194" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="205" y1="143" x2="205" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line id="cdi-needle" x1="150" y1="122" x2="150" y2="178"
                  stroke="#f0c040" stroke-width="5.5" stroke-linecap="round"/>
            <polygon points="150,62 143,84 157,84" fill="#f0c040"/>
            <line x1="150" y1="84"  x2="150" y2="122" stroke="#f0c040" stroke-width="3"/>
            <line x1="150" y1="178" x2="150" y2="228" stroke="#f0c040" stroke-width="3"/>
            <line x1="141" y1="224" x2="159" y2="224" stroke="#f0c040" stroke-width="2.5"/>
          </g>

          <!-- ⑤ Circuito de espera (HOLD) -->
          <g id="g-hold" style="display:none">
            <!-- Líneas de sectores de entrada (punteadas) -->
            <!-- Sector 1: media línea hacia adelante del OBS (inbound track ahead) -->
            <line id="hold-sec1" x1="150" y1="150" x2="150" y2="25"
                  stroke="#d060ff" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.55"/>
            <!-- Sector 2: separa PARALELA de GOTA (70°/110° desde inbound, lado de espera) -->
            <line id="hold-sec2" x1="37" y1="109" x2="263" y2="191"
                  stroke="#d060ff" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.55"/>
            <path id="hold-path" fill="none" stroke="#d060ff" stroke-width="3.5"
                  stroke-linejoin="round" opacity="0.95"/>
            <polygon id="hold-arr-in"  fill="#d060ff"/>
            <polygon id="hold-arr-out" fill="#d060ff"/>
            <circle cx="150" cy="150" r="10" fill="none" stroke="#d060ff" stroke-width="2.5"/>
          </g>

          <!-- ⑥ Avión -->
          <circle cx="150" cy="150" r="5.5" fill="#dde0ea"/>

          <!-- ⑦ Lubber line -->
          <rect x="145" y="10" width="10" height="22" rx="2.5" fill="#dde0ea"/>

        </g>
      </svg>
    </div>

  selectedVOR:'VOR:PAR', obs:0, obsVor:0, predOK:false, routeStr:'', compassHdg:null,
  magVar: getMagVar('VOR:PAR'),
  holdMode: false, holdCourse: null, holdRight: true,
  route: [], activeLeg: 1, previewLeg: 1, flpMode: false,
  prevDistToActive: null, minDistToActive: Infinity,
  distIncreasingCount: 0, routeAlert: false
};

// ═══════════════════════════════════════════════════════════
//  MATH
// ═══════════════════════════════════════════════════════════
const toRad     = d => d * Math.PI / 180;
const toDeg     = r => r * 180 / Math.PI;
const norm360   = d => ((d % 360) + 360) % 360;
const normPM180 = d => { d = norm360(d); return d > 180 ? d - 360 : d; };

function bearing(la1, lo1, la2, lo2) {
  const φ1=toRad(la1), φ2=toRad(la2), Δλ=toRad(lo2-lo1);
  return norm360(toDeg(Math.atan2(
    Math.sin(Δλ)*Math.cos(φ2),
    Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ)
  )));
}

function distNm(la1, lo1, la2, lo2) {
  const R=3440.065;
  const φ1=toRad(la1), φ2=toRad(la2);
  const Δφ=toRad(la2-la1), Δλ=toRad(lo2-lo1);
  const a=Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcCDI(magRadial, obs) {
  const brgToVOR = norm360(magRadial + 180);
  const toDev    = normPM180(brgToVOR - obs);
  const fromDev  = normPM180(magRadial - obs);
  const F = 10;
  if (Math.abs(toDev) < 87) return { flag:'TO',   frac: clamp( toDev/F) };
  if (Math.abs(toDev) > 93) return { flag:'FROM', frac: clamp(-fromDev/F) };
  return { flag:'OFF', frac:0 };
}
const clamp = v => Math.max(-1, Math.min(1, v));

// ═══════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════

// Distancia en NM al punto donde el track del avión intercepta la línea del OBS.
// (dx,dy): posición del avión relativa al VOR en NM (Norte+, Este+).
// (vx,vy): vector unitario del track del avión.
// (rx,ry): vector unitario del radial OBS.
// Devuelve null si los rumbos son paralelos o la intersección está atrás.
function calcInterceptNm(dx, dy, vx, vy, rx, ry) {
  const det = rx * vy - ry * vx;
  if (Math.abs(det) < 0.01) return null;
  const s = (ry * dx - rx * dy) / det;
  return s > 0.1 ? s : null;
}

// Predicciones (intercepción, ET/ETA, auto-avance de WP) sólo con velocidad suficiente.
// Histéresis 10/12 kt para que no parpadeen al rondar el umbral.
const PRED_KT_OFF = 10, PRED_KT_ON = 12;
function updatePredOK() {
  const kt = S.gpsSpeed * 3600 / 1852;
  S.predOK = S.predOK ? kt >= PRED_KT_OFF : kt >= PRED_KT_ON;
}

// Estado de la UI persistido: iOS descarta la PWA en segundo plano y la auto-actualización recarga.
let _uiLast = '';
function saveUi() {
  const s = JSON.stringify({
    flp: S.flpMode, vor: S.selectedVOR, nav2: S.nav2, obs: S.flpMode ? S.obsVor : S.obs,
    leg: S.activeLeg, route: S.routeStr
  });
  if (s === _uiLast) return;
  try { localStorage.setItem('vor_ui', s); _uiLast = s; } catch(e) {}
}

// Brújula del teléfono. webkitCompassHeading (iOS) es magnético y referido al borde
// superior del equipo en vertical; + window.orientation lo lleva al borde superior de la pantalla.
let _cmpT = 0, _cmpOn = false;
function onCompass(e) {
  const h = e.webkitCompassHeading;
  if (typeof h !== 'number' || h < 0) return;
  const o = typeof window.orientation === 'number' ? window.orientation : 0;
  const hdg = norm360(Math.round(h + o));
  const was = S.compassHdg;
  S.compassHdg = hdg;
  if (S.predOK || hdg === was) return;
  const now = Date.now();
  if (now - _cmpT < 100) return;
  _cmpT = now;
  update();
}
function enableCompass() {
  if (_cmpOn) return;
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return;
  const start = () => {
    if (_cmpOn) return;
    _cmpOn = true;
    window.addEventListener('deviceorientation', onCompass);
  };
  if (typeof DOE.requestPermission === 'function') {
    DOE.requestPermission().then(r => { if (r === 'granted') start(); }).catch(() => {});
  } else {
    start();
  }
}

function restoreUi() {
  let u = null;
  try { u = JSON.parse(localStorage.getItem('vor_ui')); } catch(e) {}
  if (!u) return null;
  const kv = NAVAIDS[u.vor] ? u.vor : NAV_VIEJOS[u.vor];
  if (kv) { S.selectedVOR = kv; S.magVar = getMagVar(kv); }
  const k2 = NAVAIDS[u.nav2] ? u.nav2 : NAV_VIEJOS[u.nav2];
  if (k2) S.nav2 = k2;
  if (Number.isFinite(u.obs)) S.obs = S.obsVor = norm360(u.obs);
  return u;
}

function update() {
  saveUi();
  // En modo FLP el "VOR" es el waypoint activo de la ruta
  let vor = NAVAIDS[S.selectedVOR];
  if (S.flpMode && S.route.length > 1 && S.activeLeg < S.route.length) {
    const wp = S.route[S.activeLeg];
    vor = { lat: wp.lat, lon: wp.lon, id: wp.ident };
    // Auto-set OBS al rumbo magnético directo al WP
    if (S.acLat !== null) {
      const trk = norm360(bearing(S.acLat, S.acLon, wp.lat, wp.lon) - S.magVar);
      S.obs = Math.round(trk);
    }
  }
  const magVar = S.magVar;

  // < 10 kt: rumbo de la brújula del teléfono (pínula); si no hay, track GPS o Norte arriba
  const useCompass = !S.predOK && S.compassHdg !== null;
  const useTrack   = !useCompass && S.acLat !== null && S.gpsTrack !== null && S.gpsSpeed > 0.5;
  const magHeading = useCompass ? S.compassHdg
                   : useTrack   ? norm360(S.gpsTrack - magVar) : 0;

  $('g-compass').setAttribute('transform', `rotate(${-magHeading},150,150)`);
  $('g-course') .setAttribute('transform', `rotate(${norm360(S.obs-magHeading)},150,150)`);
  // HDG = rumbo de la brújula (< 10 kt); TRK = track GPS magnético (en vuelo); N↑ sin datos
  $('trk-lbl').textContent = useCompass ? 'HDG' : useTrack ? 'TRK' : '';
  $('trk-val').textContent = (useCompass || useTrack) ? pad3(Math.round(magHeading) % 360) : 'N↑';

  dibujarBrg2(magHeading);
  $('nav1-badge').textContent = navId(S.selectedVOR);

  if (S.holdMode) {
    $('g-hold').setAttribute('transform',
      `rotate(${norm360(S.holdCourse-magHeading)},150,150)`);
  }

  if (S.acLat === null) { S.l1v = '--'; S.l1s = ''; S.dme = null; renderSlots(); return; }

  const trueRadial = bearing(vor.lat, vor.lon, S.acLat, S.acLon);
  const magRadial  = norm360(trueRadial - magVar);
  const brgToVOR   = norm360(magRadial + 180);
  const dist       = distNm(S.acLat, S.acLon, vor.lat, vor.lon);

  const { flag, frac } = calcCDI(Math.round(magRadial), S.obs);
  let cdiFrac = frac;
  if (S.flpMode && S.activeLeg > 0 && S.activeLeg < S.route.length) {
    const prev = S.route[S.activeLeg - 1];
    const cur  = S.route[S.activeLeg];
    if (prev) {
      const d_pd = distNm(prev.lat, prev.lon, S.acLat, S.acLon);
      const θ_pc = toRad(bearing(prev.lat, prev.lon, cur.lat,  cur.lon));
      const θ_pa = toRad(bearing(prev.lat, prev.lon, S.acLat, S.acLon));
      const xte  = Math.asin(Math.max(-1, Math.min(1,
        Math.sin(d_pd / 3440.07) * Math.sin(θ_pa - θ_pc)))) * 3440.07;
      cdiFrac = clamp(-xte / 0.5); // full-scale ±0.5 NM; aguja apunta hacia la ruta
      // L1 en RTE: desviación lateral respecto del tramo (+ = a la derecha del curso)
      S.l1v = Math.abs(xte).toFixed(1) + (Math.abs(xte) < 0.05 ? '' : xte > 0 ? ' R' : ' L');
      S.l1s = 'NM';
    }
  }
  const nx = 150 + cdiFrac * 55;
  $('cdi-needle').setAttribute('x1', nx);
  $('cdi-needle').setAttribute('x2', nx);

  const tf = $('tofrom-text');
  tf.textContent = (flag === 'OFF') ? '---' : flag;
  tf.style.color = (flag==='TO'||flag==='FROM') ? '#fff' : '#333';

  $('g-rmi').setAttribute('transform', `rotate(${norm360(brgToVOR-magHeading)},150,150)`);
  S.dme = dist;
  $('radial-val').textContent = pad3(Math.round(magRadial));

  // L1 en VOR: distancia y tiempo hasta interceptar el radial del OBS con el track actual
  if (!S.flpMode) {
    S.l1v = '<>'; S.l1s = '';          // < 10 kt, sin TO/FROM o divergiendo
    if (useTrack && S.predOK && flag !== 'OFF') {
      const latR = toRad(vor.lat);
      const dx   = (S.acLon - vor.lon) * 60 * Math.cos(latR);
      const dy   = (S.acLat - vor.lat) * 60;
      const mhR  = toRad(magHeading);
      const obsR = toRad(S.obs);
      const s = calcInterceptNm(dx, dy, Math.sin(mhR), Math.cos(mhR),
                                         Math.sin(obsR), Math.cos(obsR));
      if (s !== null && s < 500) {
        const kt = S.gpsSpeed * 3600 / 1852;
        const tm = Math.round(s * 60 / kt);
        if (tm <= 99) {
          S.l1v = s.toFixed(1);
          S.l1s = String(tm).padStart(2, '0') + ' min';
        }
      }
    }
  }

  // Auto-avance / alerta cuando se aleja del WP activo
  // Con < 10 kt el ruido del GPS simula alejamientos: no se evalúa.
  if (S.flpMode && S.acLat !== null && S.activeLeg < S.route.length && !S.predOK) {
    S.prevDistToActive = null;
    S.distIncreasingCount = 0;
  } else if (S.flpMode && S.acLat !== null && S.activeLeg < S.route.length) {
    S.minDistToActive = Math.min(S.minDistToActive, dist);
    if (S.prevDistToActive !== null && dist > S.prevDistToActive + 0.01) {
      S.distIncreasingCount++;
      if (S.distIncreasingCount >= 3) {
        if (S.minDistToActive < 1.0 && S.activeLeg < S.route.length - 1) {
          // Pasó el WP dentro del radio de 1 NM → avance automático
          S.activeLeg++;
          S.previewLeg = S.activeLeg;
          S.prevDistToActive = null;
          S.minDistToActive = Infinity;
          S.distIncreasingCount = 0;
        } else if (S.minDistToActive >= 1.0 && !S.routeAlert) {
          // Se alejó sin pasar el WP → advertencia
          S.routeAlert = true;
          showRouteAlert(S.route[S.activeLeg].ident);
        }
      }
    } else {
      S.distIncreasingCount = 0;
    }
    S.prevDistToActive = dist;
  }

  saveUi();
  renderSlots();
}

// ═══════════════════════════════════════════════════════════
//  RECTÁNGULOS I1–I5 / D1–D5 (contenido según el modo)
//    VOR: I1 OBS · I2 ETE · I3 ETA · I4 CRONO · I5 VOR
//         D1 DME · D2 ICP · D3 TIME (sólo HOLD) · D4 UTC · D5 HOLD
//    RTE: I1 NEXT · I2 ETE · I3 ETA · I4 CRONO · I5 RTE
//         D1 DME · D2 ETE FIN · D3 ETA FIN · D4 UTC · D5 DAT
// ═══════════════════════════════════════════════════════════
const p2 = n => String(n).padStart(2, '0');
const fmtHM = min => { const m = Math.round(min); return Math.floor(m / 60) + ':' + p2(m % 60); };
const fmtZ  = d => p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes());   // UTC, sin Z
const SLOTS = ['i1','i2','i3','i4','i5','d1','d2','d3','d4','d5'];

// sp = { tag, val, sub, mini, cls, btn }; null → rectángulo vacío.
// Sólo toca el DOM (y reajusta la letra) si cambió algo.
const _slotKey = {};
function setSlot(id, sp) {
  sp = sp || {};
  const cls = 'slot ' + (sp.cls || 'vacio') + (sp.btn ? ' btn' : '');
  const key = [cls, sp.tag || '', sp.val || '', sp.sub || '', sp.mini || '', sp.esc || ''].join('|');
  if (_slotKey[id] === key) return;
  _slotKey[id] = key;
  $('slot-' + id).className = cls;
  $('slot-' + id).dataset.esc = sp.esc || '';     // escala del valor (ICP sin datos: «<>» al 50 %)
  $(id + '-tag') .textContent = sp.tag  || '';
  $(id + '-val') .textContent = sp.val  || '';
  $(id + '-sub') .textContent = sp.sub  || '';
  $(id + '-mini').textContent = sp.mini || '';
  fitSlot(id);
}

// El valor crece hasta llenar el rectángulo (limitado por el ancho y por el alto que
// dejan el rótulo y la segunda línea). Los botones (VOR, RTE, HOLD, DAT) tienen tope.
// Con segunda línea (ICP: distancia y tiempo) el alto libre se reparte 60/40.
// El rótulo chico de la esquina (ICP) no ocupa alto: el valor, centrado, le deja
// libre ese ancho de los dos lados y así no lo pisa.
const BTN_MAX = 44, SUB_MAX = 32;
function fitSlot(id) {
  const box  = $('slot-' + id);
  const mini = $(id + '-mini');
  const W = box.clientWidth - 10, H = box.clientHeight - 6;
  if (W <= 0 || H <= 0) return;                 // pantalla oculta: se ajusta al volver
  const tag = $(id + '-tag'), v = $(id + '-val'), sb = $(id + '-sub');
  let libre = H - (tag.textContent ? tag.offsetHeight + 2 : 0);
  const Wv = mini.textContent ? W - 2 * (mini.offsetWidth + 6) : W;
  const medir = el => { el.style.fontSize = '100px'; return [el.scrollWidth, el.offsetHeight]; };
  let hVal = libre;
  if (sb.textContent) {
    hVal = (libre - 2) * 0.6;
    const [ws, hs] = medir(sb);
    sb.style.fontSize = Math.floor(Math.min(SUB_MAX, 100 * W / ws, 100 * (libre - 2) * 0.4 / hs)) + 'px';
  }
  if (!v.textContent) return;
  const [w, h] = medir(v);
  if (!w || !h) return;
  const tope = box.classList.contains('btn') ? BTN_MAX : 200;
  const esc  = parseFloat(box.dataset.esc) || 1;
  v.style.fontSize = Math.max(8, Math.floor(esc * Math.min(tope, 100 * Wv / w, 100 * hVal / h))) + 'px';
}
// Cada rectángulo se reajusta solo cuando cambia de tamaño (barra de Safari, volver
// de otra pantalla). El tamaño del rectángulo no depende de su texto: no hay bucle.
function initFitObserver() {
  if (typeof ResizeObserver !== 'function') {
    window.addEventListener('resize', () => setTimeout(() => SLOTS.forEach(fitSlot), 50));
    return;
  }
  const ro = new ResizeObserver(es => es.forEach(e => fitSlot(e.target.id.slice(5))));
  SLOTS.forEach(id => ro.observe($('slot-' + id)));
}

function renderSlots() {
  const kt   = S.gpsSpeed * 3600 / 1852;
  const pred = S.predOK && S.acLat !== null;
  const now  = Date.now();
  const utc   = { tag:'UTC',   val:fmtZ(new Date(now)), cls:'c-wht' };
  const crono = { tag:'CRONO', val:cronoTxt(now),       cls:'c-green' };
  const dme   = S.dme === null ? '--.-' : S.dme.toFixed(1);

  if (S.flpMode) {
    const wp = S.route[S.activeLeg];
    let ete = '-:--', eta = '--:--', eteF = '-:--', etaF = '--:--';
    if (pred && wp) {
      const m1 = cumulativeDistToLeg(S.activeLeg) / kt * 60;          // al WP activo
      const m2 = cumulativeDistToLeg(S.route.length - 1) / kt * 60;   // a fin de ruta
      ete  = fmtHM(m1); eta  = fmtZ(new Date(now + m1 * 60000));
      eteF = fmtHM(m2); etaF = fmtZ(new Date(now + m2 * 60000));
    }
    setSlot('i1', { tag:'NEXT', val: wp ? wp.ident : '---', cls:'c-next' });
    setSlot('i2', { tag:'ETE', val:ete, cls:'c-cyan' });
    setSlot('i3', { tag:'ETA', val:eta, cls:'c-cyan' });
    setSlot('i4', crono);
    setSlot('i5', { val:'RTE', cls:'b-rte', btn:true });
    setSlot('d1', { tag:'DME', val:dme, cls:'c-dme-r' });
    setSlot('d2', { tag:'ETE FIN', val:eteF, cls:'c-brown' });
    setSlot('d3', { tag:'ETA FIN', val:etaF, cls:'c-brown' });
    setSlot('d4', utc);
    setSlot('d5', { val:'DAT', cls:'b-dat', btn:true });
    return;
  }

  const vor = NAVAIDS[S.selectedVOR];
  let ete = '-:--', eta = '--:--';
  if (pred) {
    const m = distNm(S.acLat, S.acLon, vor.lat, vor.lon) / kt * 60;
    ete = fmtHM(m); eta = fmtZ(new Date(now + m * 60000));
  }
  setSlot('i1', { tag:'OBS', val:pad3(S.obs), cls:'c-yel' });
  setSlot('i2', { tag:'ETE', val:ete, cls:'c-yel' });
  setSlot('i3', { tag:'ETA', val:eta, cls:'c-yel' });
  setSlot('i4', crono);
  setSlot('i5', { val:'VOR', cls:'b-vor', btn:true });
  setSlot('d1', { tag:'DME', val:dme, cls:'c-dme-v' });
  setSlot('d2', { mini:'ICP', val:S.l1v, sub:S.l1s, cls:'c-wht', esc: S.l1v === '<>' ? 0.5 : 0 });
  // D3: NAV2 (rosado); durante el HOLD lo tapa la cuenta regresiva TIME
  setSlot('d3', S.holdMode
    ? { tag:'TIME', val:holdTimerTxt(), cls: HT.flashing ? (HT.flashOn ? 'c-mag-on' : 'c-mag-off') : 'c-mag' }
    : { tag:'NAV2', val: navId(S.nav2), cls:'c-pink' });
  setSlot('d4', utc);
  setSlot('d5', S.holdMode ? { tag:'HOLD', val:pad3(S.holdCourse), cls:'b-hold-on' }
                           : { val:'HOLD', cls:'b-hold', btn:true });
}

// Toques en los rectángulos
function slotTap(id) {
  if (id === 'i4') { cronoTap(); return; }
  if (id === 'i5') {                              // con HOLD activo, VOR sólo sale del HOLD
    if (!S.flpMode && S.holdMode) toggleHoldMode(); else flpToggleTap();
    return;
  }
  if (S.flpMode) { if (id === 'd5') rteAction(); return; }
  if (id === 'i1') openKbd('OBS');
  else if (id === 'd3') { if (S.holdMode) holdTimerTap(); else nav2Tap(); }
  else if (id === 'd5') holdBtnTap();
}

// Rosa: en modo VOR abre la configuración
function roseTap() { if (!S.flpMode) showConfig(); }

// Toque largo (1 s) sobre un rectángulo: hace `accion` si `cuando()` es verdadero.
// El click que sigue al toque largo se descarta (largo[id]).
const largo = {};
function initLongPress(id, cuando, accion) {
  const el = $('slot-' + id);
  let t = null;
  const fin = () => { clearTimeout(t); t = null; };
  el.addEventListener('pointerdown', () => {
    fin(); largo[id] = false;
    if (!cuando()) return;
    t = setTimeout(() => { t = null; largo[id] = true; accion(); }, 1000);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, fin));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// D5 en VOR: apagado → toque lo enciende; encendido → toque abre el teclado del curso
// (y del sentido de giro); mantener 1 s lo apaga.
function holdBtnTap() {
  if (largo.d5) { largo.d5 = false; return; }
  if (!S.holdMode) toggleHoldMode(); else openKbd('HOLD');
}
function initHoldPress() {
  initLongPress('d5', () => !S.flpMode && S.holdMode, toggleHoldMode);
  initLongPress('d3', () => !S.flpMode && !S.holdMode && !!S.nav2, nav2Swap);
}

// NAV2 (D3 en VOR): toque → lista de NAV AID para elegirlo; mantener 1 s → intercambia NAV1 y NAV2.
// El rumbo al NAV2 se ve en la rosa como una punta de flecha rosada.
function nav2Tap() {
  if (largo.d3) { largo.d3 = false; return; }
  showSettings('NAV2');
}
function nav2Swap() {
  if (!S.nav2) return;
  const n1 = S.selectedVOR;
  S.selectedVOR = S.nav2;
  S.magVar = getMagVar(S.selectedVOR);
  S.nav2 = n1;
  update();
}

// Punta de flecha en el bisel: rumbo magnético desde el avión a un 2.º punto.
//   RTE → WP después del NEXT (cyan; no hay en el último tramo). VOR → NAV2 (rosado).
function dibujarBrg2(magHeading) {
  const g = $('g-brg2');
  let p = null, color = '#00e5ff';
  if (S.flpMode) {
    p = S.route[S.activeLeg + 1] || null;
  } else if (S.nav2 && NAVAIDS[S.nav2]) {
    p = NAVAIDS[S.nav2]; color = '#ff8fc8';
  }
  if (!p || S.acLat === null) { g.style.display = 'none'; S.brg2 = null; return; }
  const brg = norm360(bearing(S.acLat, S.acLon, p.lat, p.lon) - S.magVar);
  S.brg2 = brg;
  $('brg2-tri').setAttribute('fill', color);
  g.setAttribute('transform', `rotate(${norm360(brg - magHeading)},150,150)`);
  g.style.display = '';
}

// Cronómetro (I4), mm:ss: toque → arranca; toque → se detiene; toque → a cero; y así.
// Se mide con el reloj (no cuenta ticks): no se atrasa si la app queda en segundo plano.
const CR = { est:0, t0:0, ms:0 };   // est: 0 en cero, 1 corriendo, 2 detenido
try { Object.assign(CR, JSON.parse(localStorage.getItem('vor_crono')) || {}); } catch(e) {}
function cronoTap() {
  const now = Date.now();
  if (CR.est === 0)      { CR.est = 1; CR.t0 = now; }
  else if (CR.est === 1) { CR.est = 2; CR.ms = now - CR.t0; }
  else                   { CR.est = 0; CR.ms = 0; }
  try { localStorage.setItem('vor_crono', JSON.stringify(CR)); } catch(e) {}
  renderSlots();
}
function cronoTxt(now) {
  const s = Math.max(0, Math.floor((CR.est === 1 ? now - CR.t0 : CR.ms) / 1000));
  return p2(Math.floor(s / 60)) + ':' + p2(s % 60);
}

// LOG de vuelo acumulado: suma el tiempo entre fixes consecutivos con SOG > 50 kt.
// Un hueco entre fixes (app suspendida) se cuenta hasta 10 min.
// v6.00: no tiene rectángulo asignado; se sigue acumulando para cuando se lo ubique.
const LOG_KT = 50, LOG_GAP_MAX = 10 * 60000;
let _logT = null;
try { S.logMs = parseFloat(localStorage.getItem('vor_log_ms')) || 0; } catch(e) {}

function logFix(now) {
  const kt = S.gpsSpeed * 3600 / 1852;
  if (kt > LOG_KT) {
    if (_logT !== null) {
      S.logMs += Math.min(now - _logT, LOG_GAP_MAX);
      try { localStorage.setItem('vor_log_ms', String(S.logMs)); } catch(e) {}
    }
    _logT = now;
  } else {
    _logT = null;
  }
}

function logReset() {
  if (!confirm('¿Poner el LOG de vuelo en cero?')) return;
  S.logMs = 0; _logT = null;
  try { localStorage.setItem('vor_log_ms', '0'); } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
//  COMPASS ROSE — labels orientados radialmente
//  Cada label se rota rotate(deg, tx, ty) para que su base
//  quede perpendicular al radio (legible desde el borde).
// ═══════════════════════════════════════════════════════════
function drawCompassRose() {
  const g = $('g-compass');
  const CX=150, CY=150, R=140;
  const LABELS = {
    0:'36', 30:'03', 60:'06', 90:'09',
    120:'12', 150:'15', 180:'18',
    210:'21', 240:'24', 270:'27', 300:'30', 330:'33'
  };
  const CARD = new Set([0,90,180,270]);

  for (let deg=0; deg<360; deg+=5) {
    const isMaj = deg%30===0;
    const isMed = deg%10===0 && !isMaj;
    const tLen  = isMaj ? 15 : isMed ? 10 : 5;
    const color = isMaj ? '#c0c4cc' : isMed ? '#e8ecf4' : '#282c34';
    const sw    = isMaj ? 3 : 1;
    const rad   = toRad(deg-90);
    const x1=CX+R*Math.cos(rad),        y1=CY+R*Math.sin(rad);
    const x2=CX+(R-tLen)*Math.cos(rad), y2=CY+(R-tLen)*Math.sin(rad);

    const ln = svgEl('line');
    ln.setAttribute('x1',x1); ln.setAttribute('y1',y1);
    ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',color); ln.setAttribute('stroke-width',sw);
    g.appendChild(ln);

    if (isMaj) {
      const tR = R - 42;
      const tx=CX+tR*Math.cos(rad), ty=CY+tR*Math.sin(rad);
      const isC = CARD.has(deg);
      const t = svgEl('text');
      t.setAttribute('x',tx); t.setAttribute('y',ty);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','middle');
      t.setAttribute('font-size', isC ? '26' : '20');
      t.setAttribute('font-weight', isC ? '700' : '500');
      t.setAttribute('fill','#e8ecf4');
      t.setAttribute('font-family',"'Courier New',monospace");
      // orientación radial: base del número perpendicular al radio
      t.setAttribute('transform', `rotate(${deg},${tx},${ty})`);
      t.textContent = LABELS[deg];
      g.appendChild(t);
      // N pequeño debajo del "36"
      if (deg === 0) {
        const n = svgEl('text');
        n.setAttribute('x', tx); n.setAttribute('y', String(ty + 20));
        n.setAttribute('text-anchor','middle'); n.setAttribute('dominant-baseline','middle');
        n.setAttribute('font-size','16'); n.setAttribute('font-weight','700');
        n.setAttribute('fill','#e8ecf4'); n.setAttribute('font-family',"'Courier New',monospace");
        n.setAttribute('transform',`rotate(0,${tx},${ty+20})`);
        n.textContent = 'N';
        g.appendChild(n);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  CIRCUITO DE ESPERA (HOLD)
// ═══════════════════════════════════════════════════════════
const HOLD_R = 22;
const HOLD_L = 58;

function buildHoldGeometry() {
  const CX=150, CY=150;
  const s     = S.holdRight ?  1 : -1;
  const sweep = S.holdRight ? '1' : '0';
  const xo    = CX + s * 2 * HOLD_R;
  const yb    = CY + HOLD_L;

  $('hold-path').setAttribute('d',
    `M ${CX},${CY} A ${HOLD_R},${HOLD_R} 0 0 ${sweep} ${xo},${CY} ` +
    `L ${xo},${yb} A ${HOLD_R},${HOLD_R} 0 0 ${sweep} ${CX},${yb} Z`);

  const ym = CY + HOLD_L/2;
  $('hold-arr-in') .setAttribute('points', `${CX},${ym-10} ${CX-7},${ym+4} ${CX+7},${ym+4}`);
  $('hold-arr-out').setAttribute('points', `${xo},${ym+10} ${xo-7},${ym-4} ${xo+7},${ym-4}`);

  // Línea de sector 2: 70° desde el inbound, del lado de la espera
  // hold DER: bearing 110° desde el fijo; hold IZQ: bearing 70° (mirror)
  const RL = 120;
  const brg2 = S.holdRight ? 110 : 70;
  const dx2  = RL * Math.sin(toRad(brg2));
  const dy2  = -RL * Math.cos(toRad(brg2));  // SVG y invertido
  const s2 = $('hold-sec2');
  s2.setAttribute('x1', (CX - dx2).toFixed(1));
  s2.setAttribute('y1', (CY - dy2).toFixed(1));
  s2.setAttribute('x2', (CX + dx2).toFixed(1));
  s2.setAttribute('y2', (CY + dy2).toFixed(1));
}

// Sector de entrada estándar (regla 70°/110°).
// Devuelve 'DIRECTA', 'PARALELO' o 'GOTA'
function holdEntry(magHeading, course, right) {
  const d = right ? norm360(magHeading - course) : norm360(course - magHeading);
  if (d < 180) return 'DIRECTA';
  if (d < 290) return 'PARALELO';
  return 'GOTA';
}

function toggleHoldMode() {
  S.holdMode = !S.holdMode;
  if (S.holdMode) {
    S.holdCourse = S.obs;  // siempre toma el OBS actual al entrar
    $('g-hold').style.display = '';
    buildHoldGeometry();
  } else {
    $('g-hold').style.display = 'none';
  }
  holdTimerReset();
  update();
}

// ═══════════════════════════════════════════════════════════
//  CUENTA REGRESIVA DEL HOLD (D3, TIME — 60 s)
// ═══════════════════════════════════════════════════════════
const HT = { active:false, flashing:false, flashOn:false, secs:60, itvl:null, flashItvl:null };

function holdTimerTap() {
  if (HT.flashing) {
    // Al terminar y titilar → reinicia la cuenta
    clearInterval(HT.flashItvl);
    HT.flashing = false;
    HT.secs = 60; HT.active = true;
    clearInterval(HT.itvl);
    HT.itvl = setInterval(holdTimerTick, 1000);
    holdTimerRender();
  } else if (!HT.active) {
    // TIME → iniciar
    HT.secs = 60; HT.active = true;
    clearInterval(HT.itvl);
    HT.itvl = setInterval(holdTimerTick, 1000);
    holdTimerRender();
  } else {
    // Contando → detener y volver a TIME
    holdTimerReset();
  }
}

function holdTimerTick() {
  HT.secs--;
  if (HT.secs <= 0) {
    HT.secs = 0; HT.active = false;
    clearInterval(HT.itvl);
    HT.flashing = true; HT.flashOn = true;    // titila verde hasta el próximo toque
    HT.flashItvl = setInterval(() => { HT.flashOn = !HT.flashOn; renderSlots(); }, 500);
  }
  holdTimerRender();
}

function holdTimerReset() {
  clearInterval(HT.itvl);
  clearInterval(HT.flashItvl);
  HT.active = false; HT.flashing = false; HT.flashOn = false; HT.secs = 60;
  holdTimerRender();
}

function holdTimerRender() { renderSlots(); }
function holdTimerTxt() { const t = HT.flashing ? 0 : HT.secs; return p2(Math.floor(t / 60)) + ':' + p2(t % 60); }

// Sentido de giro del HOLD: se elige en su teclado (tecla DER/IZQ)
const holdTurnTxt = () => S.holdRight ? '↻ DER' : '↺ IZQ';
function toggleHoldTurn() {
  S.holdRight = !S.holdRight;
  buildHoldGeometry();
  update();
}

// ═══════════════════════════════════════════════════════════
//  CONTROLES
// ═══════════════════════════════════════════════════════════
function obsDirectTo() {
  if (S.acLat === null) return;
  const vor        = NAVAIDS[S.selectedVOR];
  const trueRadial = bearing(vor.lat, vor.lon, S.acLat, S.acLon);
  const magRadial  = norm360(trueRadial - S.magVar);
  S.obs = Math.round(norm360(magRadial + 180));
  update();
}

const fmtVar = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);

// ═══════════════════════════════════════════════════════════
//  TECLADO NUMÉRICO — OBS, curso del HOLD y declinación (VAR)
//  Pantalla aparte con teclas grandes: se tipea el valor, OK lo aplica
//  y vuelve a la principal. Sin tipear nada, OK vuelve sin cambios.
// ═══════════════════════════════════════════════════════════
const K = { mode:null, buf:'', neg:false };

function openKbd(mode) {
  K.mode = mode; K.buf = '';
  K.neg  = mode === 'VAR' && S.magVar < 0;   // VAR: conserva el signo vigente
  const esVar = mode === 'VAR';
  $('kbd-title').textContent = mode === 'OBS'  ? 'OBS'
                             : mode === 'HOLD' ? 'HOLD — curso'
                             : 'VAR ' + navId(S.selectedVOR) + '  (− = W)';
  $('kbd-sign').classList.toggle('off', !esVar);
  $('kbd-dot') .classList.toggle('off', !esVar);
  // D→ en el OBS; en el HOLD la misma tecla elige el sentido de giro
  $('kbd-dto') .classList.toggle('off', esVar);
  $('kbd-dto') .classList.toggle('turn', mode === 'HOLD');
  $('kbd-dto') .textContent = mode === 'HOLD' ? holdTurnTxt() : 'D→';
  $('kbd-180') .classList.toggle('off', esVar);
  $('screen-main').style.display   = 'none';
  $('screen-config').style.display = 'none';
  $('screen-kbd').style.display  = 'flex';
  kbdRender('');
}

function closeKbd() {
  K.mode = null;
  $('screen-kbd').style.display = 'none';
  showMain();
}

function kbdActual() {
  return K.mode === 'OBS' ? S.obs : K.mode === 'HOLD' ? S.holdCourse : S.magVar;
}

function kbdRender(msg) {
  const d = $('kbd-disp');
  d.classList.remove('err', 'prev');
  if (K.mode === 'VAR') {
    if (K.buf === '') { d.textContent = fmtVar(kbdActual()); d.classList.add('prev'); }
    else d.textContent = (K.neg ? '−' : '+') + K.buf;
  } else {
    if (K.buf === '') { d.textContent = pad3(kbdActual()); d.classList.add('prev'); }
    else d.textContent = K.buf.padEnd(3, '_');
  }
  if (msg) d.classList.add('err');
  $('kbd-msg').textContent = msg || '';
}

function kbdKey(k) {
  if (k === '⌫') { K.buf = K.buf.slice(0, -1); kbdRender(''); return; }
  if (K.mode === 'VAR') {
    if (k === '±') { K.neg = !K.neg; kbdRender(''); return; }
    const [ent, dec] = K.buf.split('.');
    if (k === '.') { if (dec === undefined) K.buf = (K.buf || '0') + '.'; }
    else if (dec !== undefined) { if (dec.length < 1) K.buf += k; }
    else if (ent.length < 2) K.buf += k;
  } else {
    if (k === '±' || k === '.') return;
    if (K.buf.length < 3) K.buf += k;
  }
  kbdRender(kbdValor() === null && K.buf.length >= (K.mode === 'VAR' ? 1 : 3) ? 'Fuera de rango' : '');
}

// Valor tipeado validado; null si no es válido. Rumbos 0–360 (360 = 000), VAR ±30.
function kbdValor() {
  if (K.mode === 'VAR') {
    const v = parseFloat(K.buf);
    if (!Number.isFinite(v) || v > 30) return null;
    return Math.round((K.neg ? -v : v) * 10) / 10;
  }
  const v = parseInt(K.buf, 10);
  return (Number.isInteger(v) && v <= 360) ? norm360(v) : null;
}

function kbdAplicar(v) {
  if (K.mode === 'OBS') {
    S.obs = v;
  } else if (K.mode === 'HOLD') {
    S.holdCourse = v;
  } else {
    S.magVar = v;
    localStorage.setItem('magVar_' + S.selectedVOR, S.magVar);
  }
}

function kbdOK() {
  if (K.buf === '') { closeKbd(); return; }
  const v = kbdValor();
  if (v === null) { kbdRender('Fuera de rango'); return; }
  kbdAplicar(v);
  closeKbd();
}

// +180 sobre lo tipeado o, si no se tipeó nada, sobre el valor vigente; aplica y vuelve
function kbdMas180() {
  let base = kbdActual();
  if (K.buf !== '') {
    const v = kbdValor();
    if (v === null) { kbdRender('Fuera de rango'); return; }
    base = v;
  }
  kbdAplicar(norm360(base + 180));
  closeKbd();
}

function kbdDirecto() {
  if (K.mode === 'HOLD') { toggleHoldTurn(); $('kbd-dto').textContent = holdTurnTxt(); return; }
  if (S.acLat === null) { kbdRender('Sin GPS'); return; }
  closeKbd();
  obsDirectTo();
}

// Lista de puntos para NAV1 / NAV2: con GPS, los más cercanos primero (sin GPS, por ident).
// Con texto en el buscador: ident igual, ident que empieza así, nombre (o palabra del nombre)
// que empieza así, y por último cualquier coincidencia; dentro de cada grupo, por distancia.
// Filtros VOR / NDB / AD / FIX. Se muestran hasta NAV_LIM tarjetas.
const NAV_LIM = 60;
const navCats = { VOR:true, NDB:true, AD:true, FIX:true };
function navChip(el) {
  navCats[el.dataset.cat] = !navCats[el.dataset.cat];
  el.classList.toggle('on', navCats[el.dataset.cat]);
  renderNAVCards();
}
const normTxt = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const escHtml = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
// Posiciones donde q aparece en nm. 130 nombres de aeródromos (MADHEL 2015) vienen de la base con
// una letra perdida («Paran�»): ese «�» vale por cualquier letra, así «PARANA» los encuentra igual.
function hallar(nm, q) {
  const r = [];
  afuera: for (let i = 0; i + q.length <= nm.length; i++) {
    for (let j = 0; j < q.length; j++) {
      const c = nm[i + j];
      if (c !== q[j] && c !== '�') continue afuera;
    }
    r.push(i);
  }
  return r;
}
let _navNorm = null;
function navBuscar(q) {
  if (!_navNorm) { _navNorm = {}; for (const k in NAVAIDS) _navNorm[k] = normTxt(NAVAIDS[k].name); }
  const gps = S.acLat !== null;
  const lista = [];
  for (const k in NAVAIDS) {
    const v = NAVAIDS[k];
    if (!navCats[v.cat]) continue;
    let r = 0;
    if (q) {
      const id = v.id.toUpperCase(), nm = _navNorm[k];
      const pos = hallar(nm, q);
      if (id === q) r = 0;
      else if (id.startsWith(q)) r = 1;
      else if (pos.some(i => i === 0 || ' /(-.'.includes(nm[i - 1]))) r = 2;   // empieza una palabra
      else if (pos.length || id.includes(q)) r = 3;
      else continue;
    }
    lista.push([r, gps ? distNm(S.acLat, S.acLon, v.lat, v.lon) : 0, k]);
  }
  lista.sort((a, b) => a[0] - b[0] || (gps ? a[1] - b[1] : (NAVAIDS[a[2]].id < NAVAIDS[b[2]].id ? -1 : 1)));
  return lista;
}

function renderNAVCards() {
  const c = $('vor-cards');
  c.innerHTML = '';
  const nav2 = _navDestino === 'NAV2';
  const elegido = nav2 ? S.nav2 : S.selectedVOR;
  const q = normTxt($('nav-buscar').value.trim());

  // NAV2 se puede quitar
  if (nav2 && !q) {
    const n = document.createElement('div');
    n.className = 'vor-card' + (!S.nav2 ? ' active' : '');
    n.innerHTML = '<div class="vor-card-dot"></div><div class="vor-card-main">' +
                  '<div class="vor-card-id">NINGUNO</div><div class="vor-card-name">sin flecha de NAV2</div></div>';
    n.onclick = () => { S.nav2 = null; showMain(); };
    c.appendChild(n);
  }

  const lista = navBuscar(q);
  lista.slice(0, NAV_LIM).forEach(([, d, k]) => {
    const v = NAVAIDS[k];
    let brgStr = '---°', dmeStr = '---';
    if (S.acLat !== null) {
      brgStr = pad3(Math.round(norm360(bearing(S.acLat, S.acLon, v.lat, v.lon) - getMagVar(k)))) + '°';
      dmeStr = d.toFixed(1);
    }
    const card = document.createElement('div');
    card.className = 'vor-card' + (k === elegido ? ' active' : '');
    card.dataset.k = k;
    card.innerHTML = `
      <div class="vor-card-dot"></div>
      <div class="vor-card-main">
        <div class="vor-card-id">${escHtml(v.id)}<span class="vor-card-cat cat-${v.cat}">${escHtml(v.tipo)}</span></div>
        <div class="vor-card-name">${escHtml(v.name)}${v.freq ? ' · ' + v.freq + (v.cat === 'VOR' ? ' MHz' : ' kHz') : ''}</div>
      </div>
      <div class="vor-card-right">
        <div class="vor-card-brg">${brgStr}</div>
        <div class="vor-card-dme">${dmeStr}<span class="vor-card-dme-nm"> nm</span></div>
      </div>`;
    card.onclick = () => {
      if (nav2) {
        S.nav2 = k;
      } else {
        S.selectedVOR = k;
        S.magVar = getMagVar(k);
      }
      showMain(); // regresa automáticamente al seleccionar
    };
    c.appendChild(card);
  });

  const nota = document.createElement('div');
  nota.className = 'nav-nota';
  nota.textContent = !lista.length ? 'Sin coincidencias'
                   : lista.length > NAV_LIM ? '… y ' + (lista.length - NAV_LIM) + ' más: escribí para filtrar' : '';
  if (nota.textContent) c.appendChild(nota);
  c.parentNode.scrollTop = 0;
}

// ═══════════════════════════════════════════════════════════
//  RUTAS GUARDADAS — lista propia del teléfono, alimentada por GitHub y por el QR
// ═══════════════════════════════════════════════════════════
// vor_rutas:     [{fp, nombre, fecha, hora, via}] — clave = fp (mismos puntos = misma ruta)
// vor_rutas_bor: fp borrados en el teléfono que siguen en GitHub; sin esto la próxima
//                bajada los traería de vuelta. Se olvidan cuando GitHub ya no los tiene.

function _lsLeer(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } }
function _lsGuardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

function rutasLocales() {
  return _lsLeer('vor_rutas').sort((a, b) =>
    ((b.fecha || '') + (b.hora || '')).localeCompare((a.fecha || '') + (a.hora || '')));
}

function _ahoraUTC() {
  const d = new Date().toISOString();
  return { fecha: d.slice(0, 10), hora: d.slice(11, 13) + d.slice(14, 16) };
}

// Ruta cargada a mano (QR, ?fp=, activa previa): entra a la lista aunque se haya borrado antes
function guardarRutaLocal(fp, via) {
  const pts = parsearFp(fp);
  if (pts.length < 2) return;
  _lsGuardar('vor_rutas_bor', _lsLeer('vor_rutas_bor').filter(x => x !== fp));
  const rutas = _lsLeer('vor_rutas');
  if (rutas.some(r => r.fp === fp)) return;
  const t = _ahoraUTC();
  rutas.push({ fp, nombre: pts[0].ident + ' → ' + pts[pts.length - 1].ident,
               fecha: t.fecha, hora: t.hora, via });
  _lsGuardar('vor_rutas', rutas);
}

let _ghFps = null;   // fp de la última lista de GitHub bajada; null = todavía no se sabe

function _fusionarGH(listaGH) {
  const enGH = new Set(listaGH.map(r => r.fp));
  _ghFps = enGH;
  const borradas = _lsLeer('vor_rutas_bor').filter(fp => enGH.has(fp));
  _lsGuardar('vor_rutas_bor', borradas);
  const rutas = _lsLeer('vor_rutas');
  listaGH.forEach(g => {
    if (!g.fp || parsearFp(g.fp).length < 2 || borradas.includes(g.fp)) return;
    const loc = rutas.find(r => r.fp === g.fp);
    const datos = { fp: g.fp, nombre: g.nombre || g.id, fecha: g.fecha || '', hora: g.hora || '', via: 'GitHub' };
    if (loc) Object.assign(loc, datos); else rutas.push(datos);
  });
  _lsGuardar('vor_rutas', rutas);
}

let _ghEstado = 'pendiente';   // pendiente | ok | sin conexión

function fetchRoutes() {
  return fetch('./flp/index.json?_=' + Date.now())
    .then(r => r.ok ? r.json() : [])
    .then(rutas => { _fusionarGH(Array.isArray(rutas) ? rutas : []); _ghEstado = 'ok'; })
    .catch(() => { _ghEstado = 'sin conexión'; });
}

function borrarRutasLocales(fps) {
  const set = new Set(fps);
  _lsGuardar('vor_rutas', _lsLeer('vor_rutas').filter(r => !set.has(r.fp)));
  const pend = fps.filter(fp => !_ghFps || _ghFps.has(fp));
  _lsGuardar('vor_rutas_bor', [...new Set([..._lsLeer('vor_rutas_bor'), ...pend])]);
  if (set.has(S.routeStr)) flpClearRoute();
}

const _BTN_PIE = 'cursor:pointer;font-family:"Courier New",monospace;user-select:none;-webkit-user-select:none;border-radius:10px;';

      card.append(n, f);

// Formato de FPL_MAKER: IDENT,lat,lon|IDENT,lat,lon|...
function parsearFp(fp) {
  return fp.split('|').map(seg => {
    const parts = seg.split(',');
    return { ident: parts[0].trim(), lat: parseFloat(parts[1]), lon: parseFloat(parts[2]) };
  }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
}

function aplicarRuta(fp) {
  const pts = parsearFp(fp);
  if (pts.length < 2) return false;
  S.route = pts;
  S.activeLeg = 1;
  S.previewLeg = S.activeLeg;
  S.prevDistToActive = null; S.minDistToActive = Infinity;
  S.distIncreasingCount = 0; S.routeAlert = false;
  S.routeStr = fp;
  try { localStorage.setItem('vor_route', fp); } catch(e) {}
  if (!S.flpMode) toggleFlpMode(); else update();
  return true;
}

function aplicarRutaQR(fp) {
  guardarRutaLocal(fp, 'QR');
  return aplicarRuta(fp);
}

// ═══════════════════════════════════════════════════════════
//  ESCÁNER DE QR — cámara dentro de la app (jsQR, al final del archivo)
// ═══════════════════════════════════════════════════════════

// Acepta la URL del QR de FPL_MAKER (…vor_hsi.html?fp=…) o la cadena fp sola
function fpDesdeQR(txt) {
  txt = (txt || '').trim();
  let fp = null;
  const m = txt.match(/[?&]fp=([^&#]*)/);
  if (m) {
    try { fp = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch(e) { fp = m[1]; }
  } else if (/^[^|,\s]+,-?\d/.test(txt)) {
    fp = txt;
  }
  return (fp && parsearFp(fp).length > 1) ? fp : null;
}

let _qrStream = null, _qrTimer = 0;

function abrirEscaner() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Este navegador no permite usar la cámara.');
    return;
  }
  const ov = document.createElement('div');
  ov.id = 'qr-overlay';
  ov.innerHTML =
    '<video id="qr-video" playsinline muted autoplay></video>' +
    '<div id="qr-marco"></div>' +
    '<div id="qr-estado">Apuntá al QR del FPL MAKER</div>' +
    '<div id="qr-cerrar">✕  Cerrar</div>';
  document.body.appendChild(ov);
  $('qr-cerrar').onclick = cerrarEscaner;

  const video = $('qr-video');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(stream => {
      if (!$('qr-overlay')) { stream.getTracks().forEach(t => t.stop()); return; }
      _qrStream = stream;
      video.srcObject = stream;
      video.play().catch(() => {});
      _qrLeer(video, document.createElement('canvas'));
    })
    .catch(e => {
      $('qr-estado').textContent = (e && e.name === 'NotAllowedError')
        ? 'Sin permiso de cámara. Habilitalo en Ajustes › Safari › Cámara.'
        : 'No se pudo abrir la cámara.';
      $('qr-estado').style.color = '#ff6060';
    });
}

function _qrLeer(video, canvas) {
  if (!$('qr-overlay')) return;
  if (video.readyState >= 2 && video.videoWidth) {
    // Reducido a ~720 px: jsQR lo decodifica igual y no se come la batería
    const k = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
    const w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    if (code && code.data) {
      const fp = fpDesdeQR(code.data);
      if (fp) {
        cerrarEscaner();
        if (navigator.vibrate) navigator.vibrate(80);
        aplicarRutaQR(fp);
        showRouteBanner(fp);
        return;
      }
      $('qr-estado').textContent = 'Ese QR no es una ruta del FPL MAKER';
      $('qr-estado').style.color = '#f0c040';
    }
  }
  _qrTimer = setTimeout(() => _qrLeer(video, canvas), 150);
}

function cerrarEscaner() {
  clearTimeout(_qrTimer);
  if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
  const ov = $('qr-overlay');
  if (ov) ov.remove();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') cerrarEscaner();
});

function loadRoute(ui) {
  const fp = new URLSearchParams(location.search).get('fp');
  if (fp) {
    localStorage.setItem('vor_route', fp);
    // Cookie compartida entre Safari y PWA instalada (iOS 15+)
    document.cookie = 'vor_route=' + encodeURIComponent(fp)
      + ';path=/;max-age=86400;SameSite=Lax';
    history.replaceState(null, '', location.pathname);
    showRouteBanner(fp); // banner activa FLP al cerrarse
  }
  // localStorage (mismo contexto) o cookie (cross-contexto Safari↔PWA en iOS)
  let stored = localStorage.getItem('vor_route');
  if (!stored) {
    const m = document.cookie.match(/(?:^|;)\s*vor_route=([^;]*)/);
    if (m) stored = decodeURIComponent(m[1]);
  }
  if (!stored) return;
  guardarRutaLocal(stored, fp ? 'QR' : 'previa');
  S.route = parsearFp(stored);
  S.routeStr = stored;
  // Misma ruta que antes de recargar → se restauran modo y WP activo
  const same = !fp && ui && ui.route === stored;
  S.activeLeg = (same && Number.isInteger(ui.leg) && ui.leg >= 1 && ui.leg < S.route.length)
    ? ui.leg : Math.min(1, S.route.length - 1);
  S.previewLeg = S.activeLeg;
  S.prevDistToActive = null; S.minDistToActive = Infinity;
  S.distIncreasingCount = 0; S.routeAlert = false;
  if (S.route.length > 1) {
    // Ruta nueva (QR escaneado en Safari) o estaba en RTE: activar FLP
    if (!fp && (!same || ui.flp)) setTimeout(() => { if (!S.flpMode) toggleFlpMode(); }, 150);
  }
}

function toggleFlpMode() {
  S.flpMode = !S.flpMode;
  // RTE pisa S.obs con el rumbo al WP: el OBS de VOR se guarda aparte
  if (S.flpMode) {
    S.obsVor = S.obs;
  } else {
    S.obs = S.obsVor;
  }
  if (S.flpMode && S.holdMode) toggleHoldMode(); // apagar hold al entrar en RTE
  $('radial-overlay').style.display = S.flpMode ? 'none' : '';
  $('tofrom-text').style.display    = S.flpMode ? 'none' : '';
  $('nav1-badge').style.display     = S.flpMode ? 'none' : '';
  // I5 (VOR/RTE) y D5 (HOLD/DAT) salen de renderSlots. DAT no depende de la lista de
  // GitHub: es la única puerta a WPS, al selector y a borrar la ruta activa
  update();

// Distancia acumulada desde posición actual → activeLeg → ... → idx
function cumulativeDistToLeg(idx) {
  if (S.acLat === null || !S.route[S.activeLeg]) return 0;
  let d = distNm(S.acLat, S.acLon, S.route[S.activeLeg].lat, S.route[S.activeLeg].lon);
  for (let i = S.activeLeg; i < idx; i++)
    d += distNm(S.route[i].lat, S.route[i].lon, S.route[i+1].lat, S.route[i+1].lon);
  return d;
}

function routeAlertSi() {

    S.activeLeg++;

// Selector de WP (tap en el área inferior del panel)
function showWpPicker() {
  if (!S.route || S.route.length <= 1) return;
  if (document.getElementById('wp-overlay')) return;
  const ov = document.createElement('div');
  ov.id = 'wp-overlay';

    'position:fixed;inset:0;z-index:8000',

function rteAction() {
  if (S.flpMode && S.route.length > 1) {
    showWpEst();
  } else {
    showRtePicker();

function showWpEst() {
  $('screen-main').style.display     = 'none';
  $('screen-settings').style.display = 'none';
  $('screen-wp-est').style.display   = 'flex';
  renderWpEst();
}

function renderWpEst() {
  const list = $('wp-est-list');
  list.innerHTML = '';
  const kt = S.gpsSpeed * 3600 / 1852;
  const n  = S.route.length - 1;
  S.route.forEach((wp, idx) => {
    if (idx === 0) return;
    const act = idx === S.activeLeg, pas = idx < S.activeLeg;
    let ete = '-:--', eta = '--:--';
    if (pas) ete = '--';                       // ya pasado: no hay estima
    else if (S.predOK && S.acLat !== null) {
      const m = cumulativeDistToLeg(idx) / kt * 60;
      ete = fmtHM(m);
      eta = fmtZ(new Date(Date.now() + m * 60000));
    }
    const card = document.createElement('div');
    card.className = 'wpe' + (act ? ' act' : '') + (pas ? ' pas' : '');
    card.innerHTML =
      '<div class="n"><span class="wp">' + wp.ident + (act ? ' ◀' : '') + '</span>' +
      '<span class="ix">' + idx + '/' + n + '</span></div>' +
      '<div class="t"><div><span class="l">ETE</span><span class="v">' + ete + '</span></div>' +
      '<div><span class="l">ETA</span><span class="v">' + eta + '</span></div></div>';
    card.onclick = () => {
      S.activeLeg = idx; S.previewLeg = idx;
      S.prevDistToActive = null; S.minDistToActive = Infinity;
      S.distIncreasingCount = 0; S.routeAlert = false;
      document.getElementById('route-alert')?.remove();
      showMain();
    };
    list.appendChild(card);
  });
  const a = list.querySelector('.wpe.act');
  if (a) a.scrollIntoView({ block:'nearest' });
}

function flpClearRoute() {
  localStorage.removeItem('vor_route');
  document.cookie = 'vor_route=;path=/;max-age=0';
  if (S.flpMode) S.obs = S.obsVor;
  S.route = []; S.routeStr = ''; S.activeLeg = 1; S.previewLeg = 1; S.flpMode = false;
  S.prevDistToActive = null; S.minDistToActive = Infinity;
  S.distIncreasingCount = 0; S.routeAlert = false;
  document.getElementById('route-alert')?.remove();
  $('radial-overlay').style.display = '';
  $('tofrom-text').style.display = '';
  $('nav1-badge').style.display = '';
  update();
}

// ═══════════════════════════════════════════════════════════
//  GPS — arranca automáticamente al abrir la app
// ═══════════════════════════════════════════════════════════
function startGPS() {
  if (!navigator.geolocation) return;
  if (S.watchId !== null) navigator.geolocation.clearWatch(S.watchId);

  S.watchId = navigator.geolocation.watchPosition(
    pos => {
      S.acLat    = pos.coords.latitude;
      S.acLon    = pos.coords.longitude;
      S.gpsSpeed = pos.coords.speed   || 0;
      S.gpsTrack = pos.coords.heading;
      S.gpsAcc   = pos.coords.accuracy;
      S.gpsAlt   = pos.coords.altitude;      // m, null si el equipo no la da
      S.gpsActive = true;
      updatePredOK();
      logFix(Date.now());
      $('gps-top').style.display = 'none';
      update();
    },
    _err => {
      S.gpsActive = false;
      const t = $('gps-top');
      t.textContent = '⚠ GPS'; t.style.display = '';
      setTimeout(startGPS, 15000); // reintento automático
    },
    { enableHighAccuracy:true, maximumAge:4000, timeout:20000 }
  );
}

const $     = id  => document.getElementById(id);
const svgEl = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);
const pad3  = n   => String(n).padStart(3,'0');

//  WAKE LOCK
// ═══════════════════════════════════════════════════════════
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => setTimeout(requestWakeLock, 1000));
  } catch(e) {}
}
document.addEventListener('touchstart', requestWakeLock, { once:true });
// iOS exige pedir permiso de orientación dentro de un toque (touchend/click, no touchstart)
document.addEventListener('touchend', enableCompass);
document.addEventListener('click',    enableCompass);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
setInterval(() => { if (!wakeLock || wakeLock.released) requestWakeLock(); }, 30000);

//  AUTO-UPDATE
// ═══════════════════════════════════════════════════════════
// El ETag de GitHub Pages cambia con CUALQUIER commit al repo (p. ej. subir una ruta
// a flp/index.json), aunque el HTML sea el mismo: se recarga sólo si cambió la versión.
let _lastEtag = null;
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const url = location.origin + location.pathname;
    const r = await fetch(url, { method:'HEAD', cache:'no-store' });
    const tag = r.headers.get('etag') || r.headers.get('last-modified');
    if (!tag) return;
    if (tag !== _lastEtag) {
      const html = await (await fetch(url, { cache:'no-store' })).text();
      const m = html.match(/id="app-ver">([^<]+)</);
      if (m && m[1] !== $('app-ver').textContent) { location.reload(); return; }
    }
    _lastEtag = tag;
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
setInterval(checkForUpdate, 60000);
checkForUpdate();

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
drawCompassRose();
buildHoldGeometry();
loadRoute(restoreUi());
update();   // pinta los rectángulos aunque todavía no haya GPS
setInterval(renderSlots, 500);   // UTC, cronómetro y cuenta del HOLD
initHoldPress();
initFitObserver();
fetchRoutes();
startGPS();
requestWakeLock();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
