<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VOR / HSI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      background:#0c0d11;
      color:#cdd0d8;
      font-family:-apple-system,'Helvetica Neue',sans-serif;
      width:100vw; height:100vh;
      overflow:hidden;
    }

    /* ══════════════════════════════
       LAYOUT LANDSCAPE (siempre)
    ══════════════════════════════ */
    .screen {
      width:100%; height:100%;
      display:flex;
      flex-direction:row;
      align-items:stretch;
      overflow:hidden;
    }

    /* ── Panel central ── */
    .center-panel {
      flex:1; min-width:0;
      display:flex; flex-direction:column;
      align-items:center;
      overflow:hidden;
      padding:0 2px;
    }

    /* ── Paneles laterales — columna vertical ── */
    .side-panel {
      width:155px; flex-shrink:0;
      display:flex; flex-direction:column;
      align-items:stretch;
      padding:6px; gap:5px;
    }
    .side-obs { padding-left:max(6px, env(safe-area-inset-left)); }
    .side-hdg { padding-right:max(6px, env(safe-area-inset-right)); }

    /* Encabezado (label + valor) — fuera del rectángulo */
    .ctrl-header {
      flex-shrink:0;
      display:flex; flex-direction:column;
      align-items:center; gap:1px;
    }
    /* Encabezado tocable (HDG ⇄ HOLD) */
    .ctrl-header.tap {
      cursor:pointer;
      border:1px solid #2a2d38; border-radius:10px;
      padding:2px 0;
      user-select:none; -webkit-user-select:none;
    }
    .ctrl-header.tap:active { background:#1a1d24; }

    /* Grupo: botones flecha apilados */
    .ctrl-group {
      flex:1; min-height:0;
      background:#111318;
      border:1px solid #2a2d38;
      border-radius:12px;
      padding:5px; gap:5px;
      display:flex; flex-direction:column;
    }
    .ctrl-group-obs { border-color:#f0c040; border-width:2px; }

    .ctrl-tag {
      font-size:26px; font-weight:700;
      font-family:'Courier New',monospace;
      letter-spacing:1px;
    }
    .side-obs .ctrl-tag { color:#f0c040; }
    .side-hdg .ctrl-tag { color:#00e5ff; }
    #obs-display {
      font-size:52px; color:#f0c040;
      font-weight:700;
      font-family:'Courier New',monospace;
      line-height:1;
    }
    #hdg-display {
      font-size:52px; color:#00e5ff;
      font-weight:700;
      font-family:'Courier New',monospace;
      line-height:1;
    }
    /* Botones flecha */
    .ctrl-btn {
      flex:1; min-height:0;
      background:#171920; border:1px solid #22242c;
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      user-select:none; -webkit-user-select:none;
    }
    .ctrl-btn:active { background:#1e2028; }
    .ctrl-btn-arrow    { font-size:40px; font-family:'Courier New',monospace; }
    .ctrl-btn-arrow-1  { color:#aaa; }
    .ctrl-btn-arrow-10 { color:transparent; -webkit-text-stroke:2px #ccc; }

    /* Botón +180 — fuera del rectángulo */
    .ctrl-btn-180 {
      width:100%; flex-shrink:0;
      background:#ffffff; color:#000;
      font-weight:700; font-size:26px;
      border:1px solid #fff; border-radius:8px;
      padding:5px 0; text-align:center;
      cursor:pointer;
      user-select:none; -webkit-user-select:none;
      font-family:'Courier New',monospace;
    }
    .ctrl-btn-180:active { background:#e0e0e0; }

    /* ── Botón secundario (VAR / HOLD-TURN) ── */
    .btn-varmode {
      width:100%; flex-shrink:0;
      background:#1e2028; border:1px solid #555; color:#fff;
      font-size:15px; font-family:'Courier New',monospace;
      border-radius:6px; padding:3px 0; cursor:pointer;
      text-align:center; letter-spacing:1px;
      user-select:none; -webkit-user-select:none;
    }
    .btn-varmode.active { border-color:#ff9900; color:#ff9900; background:#1a1200; }
    .side-hdg.hdg-varmode .ctrl-tag    { color:#ff9900; }
    .side-hdg.hdg-varmode #hdg-display { color:#ff9900; font-size:42px; }
    .side-hdg.hdg-varmode .ctrl-group  { border-color:#ff9900; border-width:2px; }
    .side-hdg.hdg-varmode .ctrl-btn-180 { background:#ff9900; color:#000; border-color:#ff9900; }

    /* ── Modo HOLD — violeta ── */
    .side-hdg.hdg-holdmode .ctrl-tag     { color:#d060ff; }
    .side-hdg.hdg-holdmode #hdg-display  { color:#d060ff; }
    .side-hdg.hdg-holdmode .ctrl-header  { border-color:#d060ff; }
    .side-hdg.hdg-holdmode .ctrl-group   { border-color:#d060ff; border-width:2px; }
    .side-hdg.hdg-holdmode .ctrl-btn-180 { background:#d060ff; color:#000; border-color:#d060ff; }
    .btn-varmode.hold { border-color:#d060ff; color:#d060ff; background:#1a0a22; }

    /* ── TOP BAR ── */
    .top-bar {
      width:100%; flex-shrink:0;
      display:flex; justify-content:space-between; align-items:center;
      padding:1px 6px 0;
    }
    #hold-entry {
      font-size:22px; color:#d060ff; font-weight:700;
      font-family:'Courier New',monospace; letter-spacing:1px; line-height:1;
      display:none; cursor:pointer;
      user-select:none; -webkit-user-select:none;
    }
    #gps-top {
      display:none;
      font-size:16px; color:#666; font-family:'Courier New',monospace;
    }

    /* ── HSI container ── */
    .hsi-container {
      flex:1; min-height:0;
      width:100%;
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    /* ── Interceptación de radial ── */
    #intercept-info {
      position:absolute;
      top:3px; right:4px;
      text-align:right;
      font-family:'Courier New',monospace;
      font-weight:700;
      font-size:30px;
      color:#ffffff;
      line-height:1.15;
      pointer-events:none;
      display:none;
    }
    #intercept-info span { display:block; }
    #hsi { display:block; width:100%; height:100%; max-width:100%; max-height:100%; }

    /* ── Info-bar ── */
    .info-bar {
      width:100%; flex-shrink:0;
      display:flex; flex-direction:row;
      align-items:flex-end; justify-content:space-between;
      padding:0 4px 0;
    }
    .info-col   { display:flex; flex-direction:column; align-items:flex-start; flex-shrink:0; }
    .info-col-r { align-items:flex-end; }
    .info-numrow { display:flex; align-items:baseline; gap:4px; }
    #vor-badge {
      font-size:30px; color:#f0c040; font-weight:700;
      font-family:'Courier New',monospace; letter-spacing:1px; line-height:1;
      display:inline-block;
      border:1px solid #4a5568; border-radius:8px;
      padding:3px 9px 4px; cursor:pointer;
      user-select:none; -webkit-user-select:none;
    }
    #vor-badge:active { background:#1a1d24; }
    .info-r-label {
      font-size:30px; color:#ffffff; font-weight:700;
      font-family:'Courier New',monospace; letter-spacing:1px; line-height:1;
    }
    #dme-val    { font-size:56px; font-family:'Courier New',monospace; color:#ff5555; font-weight:700; line-height:1; }
    .dme-nm     { font-size:16px; color:#fff; font-family:'Courier New',monospace; }
    #radial-val { font-size:56px; font-family:'Courier New',monospace; color:#fff; font-weight:700; line-height:1; }
    #tofrom-text {
      font-size:30px; font-weight:700; line-height:1;
      font-family:'Courier New',monospace;
      color:#333; letter-spacing:1px;
    }

    /* ════ SETTINGS SCREEN ════ */
    .settings-header {
      width:100%; display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-bottom:1px solid #18191f;
      flex-shrink:0;
    }
    .btn-back {
      background:none; border:none; color:#5a8acc;
      font-size:38px; cursor:pointer;
      padding:6px 10px 6px 0;
      display:flex; align-items:center; gap:5px;
    }
    .settings-title {
      font-size:28px; color:#777; letter-spacing:2px;
      font-family:'Courier New',monospace;
    }
    .settings-body {
      width:100%; padding:10px;
      display:flex; flex-direction:column;
      overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1;
    }
    .vor-cards { display:flex; flex-direction:column; gap:8px; }
    .vor-card {
      display:flex; align-items:center;
      padding:14px 16px; background:#141618;
      border:1px solid #202228; border-radius:12px;
      cursor:pointer; gap:12px;
    }
    .vor-card.active { background:#0b1e38; border-color:#2a5590; }
    .vor-card-dot { width:9px; height:9px; border-radius:50%; background:#252830; flex-shrink:0; }
    .vor-card.active .vor-card-dot { background:#3ac060; }
    .vor-card-main { flex:1; }
    .vor-card-id { font-size:40px; font-weight:700; font-family:'Courier New',monospace; color:#cdd0d8; letter-spacing:2px; }
    .vor-card.active .vor-card-id { color:#7eb8f7; }
    .vor-card-name { font-size:24px; color:#888; margin-top:1px; }
    .vor-card-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
    .vor-card-brg { font-size:22px; font-family:'Courier New',monospace; color:#00e5ff; letter-spacing:1px; }
    .vor-card-dme { font-size:22px; font-family:'Courier New',monospace; color:#ff5555; }
    .vor-card-dme-nm { font-size:14px; color:#555; }
  </style>
</head>
<body>

<!-- ══════════════════ PANTALLA PRINCIPAL ══════════════════ -->
<div id="screen-main" class="screen">

  <!-- OBS — panel izquierdo -->
  <div class="side-panel side-obs">
    <div class="ctrl-header tap" onclick="obsDirectTo()">
      <span class="ctrl-tag">OBS</span>
      <span id="obs-display">000°</span>
    </div>
    <div class="ctrl-btn-180" onclick="changeOBS(180)">+180</div>
    <div class="ctrl-group ctrl-group-obs">
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-10" onclick="changeOBS(+10)">▲▲</div>
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-1"  onclick="changeOBS(+1)">▲</div>
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-1"  onclick="changeOBS(-1)">▼</div>
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-10" onclick="changeOBS(-10)">▼▼</div>
    </div>
  </div>

  <!-- Centro: top-bar / HSI / info-bar -->

    <div class="top-bar">
      <span id="hold-entry" onclick="holdTimerTap()">TIME</span>
      <span id="gps-top"></span>
      <span id="tofrom-text">---</span>
    </div>

    <div class="hsi-container">
      <svg id="hsi" viewBox="14 14 272 272">
        <defs>
          <clipPath id="clip">
            <circle cx="150" cy="150" r="141"/>

        </defs>

        <rect x="0" y="0" width="300" height="300" fill="#090a0d"/>

          </g>

          <!-- ③ RMI — aguja doble barra verde -->

            <polygon points="150,50 142,72 150,82 158,72" fill="#28d858"/>
            <line x1="143" y1="71" x2="143" y2="150" stroke="#28d858" stroke-width="2.5"/>
            <line x1="157" y1="71" x2="157" y2="150" stroke="#28d858" stroke-width="2.5"/>
            <line x1="140" y1="150" x2="160" y2="150" stroke="#28d858" stroke-width="2"/>
            <line x1="143" y1="150" x2="143" y2="208" stroke="#28d858" stroke-width="2" opacity="0.5"/>

          <g id="g-course">
            <line x1="150" y1="62" x2="150" y2="238" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <line x1="95"  y1="143" x2="95"  y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="106" y1="143" x2="106" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="117" y1="143" x2="117" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="128" y1="143" x2="128" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="139" y1="143" x2="139" y2="157" stroke="#ffffff" stroke-width="1.5"/>
            <line x1="161" y1="143" x2="161" y2="157" stroke="#ffffff" stroke-width="1.5"/>

    <div class="info-bar">

        </div>

  <!-- HDG — panel derecho -->

    <div class="ctrl-group">
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-10" onclick="changeHDG(+10)">▲▲</div>
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-1"  onclick="changeHDG(+1)">▲</div>
      <div class="ctrl-btn ctrl-btn-arrow ctrl-btn-arrow-1"  onclick="changeHDG(-1)">▼</div>

</div><!-- /screen-main -->


<!-- ══════════════════ SELECCIÓN NAV AID ══════════════════ -->
<div id="screen-settings" class="screen" style="display:none; flex-direction:column;">

  <div class="settings-header">
    <button class="btn-back" onclick="showMain()">← Volver</button>
    <span class="settings-title">NAV AID</span>
  </div>

  <div class="settings-body">
    <div class="vor-cards" id="vor-cards"></div>
  </div>

</div>


<script>
// ═══════════════════════════════════════════════════════════
//  NAV AIDS DATABASE
// ═══════════════════════════════════════════════════════════
const NAVAIDS = {
  PAR: { name:'Paraná',  lat:-31.80833, lon:-60.48472, freq:'116.8', magVarDefault:-9.55 },
  SVO: { name:'Sauce V', lat:-31.71144, lon:-60.80639, freq:'NDB',   magVarDefault:-9.55 },
  ROS: { name:'Rosario', lat:-32.90500, lon:-60.78138, freq:'117.3', magVarDefault:-9.55 },
  CBA: { name:'Córdoba', lat:-31.31333, lon:-64.20362, freq:'114.5', magVarDefault:-7.40 }
};

function getMagVar(id) {
  const stored = localStorage.getItem('magVar_' + id);
  return stored !== null ? parseFloat(stored) : NAVAIDS[id].magVarDefault;
}

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const S = {
  acLat:null, acLon:null,
  gpsTrack:null, gpsSpeed:0, gpsAcc:null,
  gpsActive:false, watchId:null,
  selectedVOR:'PAR', obs:0, hdgBug:0,
  magVar: getMagVar('PAR'),
  editMagVar: false,
  holdMode: false, holdCourse: null, holdRight: true
};

// ═══════════════════════════════════════════════════════════
//  MATH
// ═══════════════════════════════════════════════════════════
const toRad     = d => d * Math.PI / 180;
const toDeg     = r => r * 180 / Math.PI;
const norm360   = d => ((d % 360) + 360) % 360;
const normPM180 = d => { d = norm360(d); return d > 180 ? d - 360 : d; };

function bearing(la1, lo1, la2, lo2) {
  const φ1=toRad(la1), φ2=toRad(la2), Δλ=toRad(lo2-lo1);
  return norm360(toDeg(Math.atan2(
    Math.sin(Δλ)*Math.cos(φ2),
    Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ)
  )));
}

function distNm(la1, lo1, la2, lo2) {
  const R=3440.065;
  const φ1=toRad(la1), φ2=toRad(la2);
  const Δφ=toRad(la2-la1), Δλ=toRad(lo2-lo1);
  const a=Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcCDI(magRadial, obs) {
  const brgToVOR = norm360(magRadial + 180);
  const toDev    = normPM180(brgToVOR - obs);
  const fromDev  = normPM180(magRadial - obs);
  const F = 10;
  if (Math.abs(toDev) < 87) return { flag:'TO',   frac: clamp( toDev/F) };
  if (Math.abs(toDev) > 93) return { flag:'FROM', frac: clamp(-fromDev/F) };
  return { flag:'OFF', frac:0 };
}
const clamp = v => Math.max(-1, Math.min(1, v));

// ═══════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════

// Distancia en NM al punto donde el track del avión intercepta la línea del OBS.
// (dx,dy): posición del avión relativa al VOR en NM (Norte+, Este+).
// (vx,vy): vector unitario del track del avión.
// (rx,ry): vector unitario del radial OBS.
// Devuelve null si los rumbos son paralelos o la intersección está atrás.
function calcInterceptNm(dx, dy, vx, vy, rx, ry) {
  const det = rx * vy - ry * vx;
  if (Math.abs(det) < 0.01) return null;
  const s = (ry * dx - rx * dy) / det;
  return s > 0.1 ? s : null;
}

function update() {
  const vor    = NAVAIDS[S.selectedVOR];
  const magVar = S.magVar;

  const useTrack   = S.acLat !== null && S.gpsTrack !== null && S.gpsSpeed > 0.5;
  const magHeading = useTrack ? norm360(S.gpsTrack - magVar) : 0;

  $('g-compass').setAttribute('transform', `rotate(${-magHeading},150,150)`);
  $('g-course') .setAttribute('transform', `rotate(${norm360(S.obs-magHeading)},150,150)`);
  $('g-hdg-bug').setAttribute('transform', `rotate(${norm360(S.hdgBug-magHeading)},150,150)`);
  $('hdg-text').textContent = useTrack ? pad3(Math.round(magHeading))+'°' : 'N↑';

  if (S.holdMode) {
    $('g-hold').setAttribute('transform',
      `rotate(${norm360(S.holdCourse-magHeading)},150,150)`);
  }

  if (S.acLat === null) return;

  const trueRadial = bearing(vor.lat, vor.lon, S.acLat, S.acLon);
  const magRadial  = norm360(trueRadial - magVar);
  const brgToVOR   = norm360(magRadial + 180);
  const dist       = distNm(S.acLat, S.acLon, vor.lat, vor.lon);

  const { flag, frac } = calcCDI(Math.round(magRadial), S.obs);
  const nx = 150 + frac * 55;
  $('cdi-needle').setAttribute('x1', nx);
  $('cdi-needle').setAttribute('x2', nx);

  const tf = $('tofrom-text');
  tf.textContent = (flag === 'OFF') ? '---' : flag;
  tf.style.color = (flag==='TO'||flag==='FROM') ? '#f0c040' : '#333';

  $('g-rmi').setAttribute('transform', `rotate(${norm360(brgToVOR-magHeading)},150,150)`);
  $('dme-val')   .textContent = dist.toFixed(1);
  $('radial-val').textContent = pad3(Math.round(magRadial));

  const iInfo = $('intercept-info');
  let showIcp = false;
  if (useTrack && flag !== 'OFF') {
    const latR = toRad(vor.lat);
    const dx   = (S.acLon - vor.lon) * 60 * Math.cos(latR);
    const dy   = (S.acLat - vor.lat) * 60;
    const mhR  = toRad(magHeading);
    const obsR = toRad(S.obs);
    const s = calcInterceptNm(dx, dy, Math.sin(mhR), Math.cos(mhR),
                                       Math.sin(obsR), Math.cos(obsR));
    if (s !== null && s < 500) {
      const kt = S.gpsSpeed * 3600 / 1852;
      const tm = Math.round(s * 60 / kt);
      if (tm <= 99) {
        $('icp-dist').textContent = s.toFixed(1) + ' NM';
        $('icp-time').textContent = String(tm).padStart(2, '0') + ' min';
        showIcp = true;
      }
    }
  }
  iInfo.style.display = showIcp ? '' : 'none';
}

// ═══════════════════════════════════════════════════════════
//  COMPASS ROSE — labels orientados radialmente
//  Cada label se rota rotate(deg, tx, ty) para que su base
//  quede perpendicular al radio (legible desde el borde).
// ═══════════════════════════════════════════════════════════
function drawCompassRose() {
  const g = $('g-compass');
  const CX=150, CY=150, R=140;
  const LABELS = {
    0:'N', 30:'03', 60:'06', 90:'E',
    120:'12', 150:'15', 180:'S',
    210:'21', 240:'24', 270:'W', 300:'30', 330:'33'
  };
  const CARD = new Set([0,90,180,270]);

  for (let deg=0; deg<360; deg+=5) {
    const isMaj = deg%30===0;
    const isMed = deg%10===0 && !isMaj;
    const tLen  = isMaj ? 15 : isMed ? 10 : 5;
    const color = isMaj ? '#c0c4cc' : isMed ? '#e8ecf4' : '#282c34';
    const sw    = isMaj ? 3 : 1;
    const rad   = toRad(deg-90);
    const x1=CX+R*Math.cos(rad),        y1=CY+R*Math.sin(rad);
    const x2=CX+(R-tLen)*Math.cos(rad), y2=CY+(R-tLen)*Math.sin(rad);

    const ln = svgEl('line');
    ln.setAttribute('x1',x1); ln.setAttribute('y1',y1);
    ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',color); ln.setAttribute('stroke-width',sw);
    g.appendChild(ln);

    if (isMaj) {
      const tR = R - 42;
      const tx=CX+tR*Math.cos(rad), ty=CY+tR*Math.sin(rad);
      const isC = CARD.has(deg);
      const t = svgEl('text');
      t.setAttribute('x',tx); t.setAttribute('y',ty);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','middle');
      t.setAttribute('font-size', isC ? '26' : '20');
      t.setAttribute('font-weight', isC ? '700' : '500');
      t.setAttribute('fill','#e8ecf4');
      t.setAttribute('font-family',"'Courier New',monospace");
      // orientación radial: base del número perpendicular al radio
      t.setAttribute('transform', `rotate(${deg},${tx},${ty})`);
      t.textContent = LABELS[deg];
      g.appendChild(t);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  CIRCUITO DE ESPERA (HOLD)
// ═══════════════════════════════════════════════════════════
const HOLD_R = 22;
const HOLD_L = 58;

function buildHoldGeometry() {
  const CX=150, CY=150;
  const s     = S.holdRight ?  1 : -1;
  const sweep = S.holdRight ? '1' : '0';
  const xo    = CX + s * 2 * HOLD_R;
  const yb    = CY + HOLD_L;

  $('hold-path').setAttribute('d',
    `M ${CX},${CY} A ${HOLD_R},${HOLD_R} 0 0 ${sweep} ${xo},${CY} ` +
    `L ${xo},${yb} A ${HOLD_R},${HOLD_R} 0 0 ${sweep} ${CX},${yb} Z`);

  const ym = CY + HOLD_L/2;
  $('hold-arr-in') .setAttribute('points', `${CX},${ym-10} ${CX-7},${ym+4} ${CX+7},${ym+4}`);
  $('hold-arr-out').setAttribute('points', `${xo},${ym+10} ${xo-7},${ym-4} ${xo+7},${ym-4}`);

  // Línea de sector 2: 70° desde el inbound, del lado de la espera
  // hold DER: bearing 110° desde el fijo; hold IZQ: bearing 70° (mirror)
  const RL = 120;
  const brg2 = S.holdRight ? 110 : 70;
  const dx2  = RL * Math.sin(toRad(brg2));
  const dy2  = -RL * Math.cos(toRad(brg2));  // SVG y invertido
  const s2 = $('hold-sec2');
  s2.setAttribute('x1', (CX - dx2).toFixed(1));
  s2.setAttribute('y1', (CY - dy2).toFixed(1));
  s2.setAttribute('x2', (CX + dx2).toFixed(1));
  s2.setAttribute('y2', (CY + dy2).toFixed(1));
}

// Sector de entrada estándar (regla 70°/110°).
// Devuelve 'DIRECTA', 'PARALELO' o 'GOTA'
function holdEntry(magHeading, course, right) {
  const d = right ? norm360(magHeading - course) : norm360(course - magHeading);
  if (d < 180) return 'DIRECTA';
  if (d < 290) return 'PARALELO';
  return 'GOTA';
}

function toggleHoldMode() {
  if (S.editMagVar) toggleMagVarEdit();
  S.holdMode = !S.holdMode;

  const panel = document.querySelector('.side-hdg');
  const btn   = $('btn-varmode');

  if (S.holdMode) {
    S.holdCourse = S.obs;  // siempre toma el OBS actual al entrar
    panel.classList.add('hdg-holdmode');
    btn.classList.add('hold');
    $('hdg-ctrl-tag').textContent = 'HOLD';
    $('hdg-display') .textContent = pad3(S.holdCourse)+'°';
    $('g-hold').style.display = '';
    $('hold-entry').style.display = 'inline-block';
    holdTimerReset();
    buildHoldGeometry();
    showHoldTurn();
  } else {
    panel.classList.remove('hdg-holdmode');
    btn.classList.remove('hold');
    btn.textContent = '▶ VAR';
    $('hdg-ctrl-tag').textContent = 'HDG';
    $('hdg-display') .textContent = pad3(S.hdgBug)+'°';
    $('g-hold').style.display  = 'none';
    $('hold-entry').style.display = 'none';
    holdTimerReset();
  }
  update();
}

// ═══════════════════════════════════════════════════════════
//  CRONÓMETRO HOLD (botón TIME — cuenta regresiva 60s)
// ═══════════════════════════════════════════════════════════
const HT = { active:false, flashing:false, secs:60, itvl:null, flashItvl:null };

function holdTimerTap() {
  if (HT.flashing) {
    // Al terminar y titilar → reinicia la cuenta
    clearInterval(HT.flashItvl);
    HT.flashing = false;
    HT.secs = 60; HT.active = true;
    clearInterval(HT.itvl);
    HT.itvl = setInterval(holdTimerTick, 1000);
    holdTimerRender();
  } else if (!HT.active) {
    // TIME → iniciar
    HT.secs = 60; HT.active = true;
    clearInterval(HT.itvl);
    HT.itvl = setInterval(holdTimerTick, 1000);
    holdTimerRender();
  } else {
    // Contando → detener y volver a TIME
    holdTimerReset();
  }
}

function holdTimerTick() {
  HT.secs--;
  if (HT.secs <= 0) {
    HT.secs = 0; HT.active = false;
    clearInterval(HT.itvl);
    HT.flashing = true;
    let on = true;
    HT.flashItvl = setInterval(() => {
      const el = $('hold-entry');
      if (!el) return;
      el.style.color       = on ? '#28d858' : '#1a0a22';
      el.style.borderColor = on ? '#28d858' : '#1a0a22';
      on = !on;
    }, 500);
  }
  holdTimerRender();
}

function holdTimerReset() {
  clearInterval(HT.itvl);
  clearInterval(HT.flashItvl);
  HT.active = false; HT.flashing = false; HT.secs = 60;
  holdTimerRender();
}

function holdTimerRender() {
  const el = $('hold-entry');
  if (!el) return;
  if (HT.flashing) {
    el.textContent   = '0:00';
    el.style.fontSize = '33px';
    return;  // color manejado por flashItvl
  }
  const nums = HT.active;
  el.textContent    = nums
    ? (Math.floor(HT.secs/60) + ':' + String(HT.secs%60).padStart(2,'0'))
    : 'TIME';
  el.style.fontSize  = nums ? '33px' : '22px';
  el.style.color       = '#d060ff';
  el.style.borderColor = '#d060ff';
}

function showHoldTurn() {
  $('btn-varmode').textContent = S.holdRight ? '↻ DER' : '↺ IZQ';
}

function toggleHoldTurn() {
  S.holdRight = !S.holdRight;
  showHoldTurn();
  buildHoldGeometry();
  update();
}

function varBtnTap() { S.holdMode ? toggleHoldTurn() : toggleMagVarEdit(); }

// ═══════════════════════════════════════════════════════════
//  CONTROLES
// ═══════════════════════════════════════════════════════════
function obsDirectTo() {
  if (S.acLat === null) return;
  const vor        = NAVAIDS[S.selectedVOR];
  const trueRadial = bearing(vor.lat, vor.lon, S.acLat, S.acLon);
  const magRadial  = norm360(trueRadial - S.magVar);
  S.obs = Math.round(norm360(magRadial + 180));
  $('obs-display').textContent = pad3(S.obs) + '°';
  update();
}

function changeOBS(delta) {
  S.obs = norm360(S.obs + delta);
  $('obs-display').textContent = pad3(S.obs)+'°';
  update();
}

function changeHDG(delta) {
  if (S.holdMode) {
    S.holdCourse = norm360(S.holdCourse + delta);
    $('hdg-display').textContent = pad3(S.holdCourse)+'°';
    update();
    return;
  }
  if (S.editMagVar) {
    if (delta === 180) { toggleMagVarEdit(); return; }
    changeMagVar(delta * 0.1);
    return;
  }
  S.hdgBug = norm360(S.hdgBug + delta);
  $('hdg-display').textContent = pad3(S.hdgBug)+'°';
  update();
}

function toggleMagVarEdit() {
  S.editMagVar = !S.editMagVar;
  const panel = document.querySelector('.side-hdg');
  const btn   = $('btn-varmode');
  const disp  = $('hdg-display');
  const btn180 = $('hdg-plus180');

  if (S.editMagVar) {
    panel.classList.add('hdg-varmode');
    btn.classList.add('active');
    btn.textContent = '● VAR';
    btn180.textContent = '✓ LISTO';
    showMagVar();
  } else {
    localStorage.setItem('magVar_' + S.selectedVOR, S.magVar);
    panel.classList.remove('hdg-varmode');
    btn.classList.remove('active');
    btn.textContent = '▶ VAR';
    btn180.textContent = '+180';
    disp.textContent = pad3(S.hdgBug) + '°';
  }
}

function changeMagVar(delta) {
  S.magVar = Math.round((S.magVar + delta) * 10) / 10;
  showMagVar();
  update();
}

function showMagVar() {
  $('hdg-display').textContent = (S.magVar >= 0 ? '+' : '') + S.magVar.toFixed(1);
}

// ═══════════════════════════════════════════════════════════
//  PANTALLAS
// ═══════════════════════════════════════════════════════════
function showSettings() {
  $('screen-main').style.display = 'none';
  $('screen-settings').style.display = 'flex';
  renderNAVCards();
}

function showMain() {
  $('screen-settings').style.display = 'none';
  $('screen-main').style.display = 'flex';
  update();
}

// Cards ordenadas por distancia (si hay GPS), con BRG y DME.
// Al tocar → selecciona y regresa a pantalla principal.
function renderNAVCards() {
  const c = $('vor-cards');
  c.innerHTML = '';

  const entries = Object.entries(NAVAIDS);

  // Ordenar por distancia si hay posición GPS
  if (S.acLat !== null) {
    entries.sort(([,a], [,b]) =>
      distNm(S.acLat, S.acLon, a.lat, a.lon) -
      distNm(S.acLat, S.acLon, b.lat, b.lon)
    );
  }

  entries.forEach(([id, v]) => {
    let brgStr = '---°', dmeStr = '---';
    if (S.acLat !== null) {
      const trueBRG = bearing(S.acLat, S.acLon, v.lat, v.lon);
      const magBRG  = norm360(trueBRG - getMagVar(id));
      brgStr = pad3(Math.round(magBRG)) + '°';
      dmeStr = distNm(S.acLat, S.acLon, v.lat, v.lon).toFixed(1);
    }

    const card = document.createElement('div');
    card.className = 'vor-card' + (id === S.selectedVOR ? ' active' : '');
    card.innerHTML = `
      <div class="vor-card-dot"></div>
      <div class="vor-card-main">
        <div class="vor-card-id">${id}</div>
        <div class="vor-card-name">${v.name}</div>
      </div>
      <div class="vor-card-right">
        <div class="vor-card-brg">${brgStr}</div>
        <div class="vor-card-dme">${dmeStr}<span class="vor-card-dme-nm"> nm</span></div>
      </div>`;

    card.onclick = () => {
      if (S.editMagVar) S.editMagVar = false;
      S.selectedVOR = id;
      S.magVar = getMagVar(id);
      $('vor-badge').textContent = id;
      showMain(); // regresa automáticamente al seleccionar
    };
    c.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════
//  GPS — arranca automáticamente al abrir la app
// ═══════════════════════════════════════════════════════════
function startGPS() {
  if (!navigator.geolocation) return;
  if (S.watchId !== null) navigator.geolocation.clearWatch(S.watchId);

  S.watchId = navigator.geolocation.watchPosition(
    pos => {
      S.acLat    = pos.coords.latitude;
      S.acLon    = pos.coords.longitude;
      S.gpsSpeed = pos.coords.speed   || 0;
      S.gpsTrack = pos.coords.heading;
      S.gpsAcc   = pos.coords.accuracy;
      S.gpsActive = true;
      $('gps-top').style.display = 'none';
      update();
    },
    _err => {
      S.gpsActive = false;
      const t = $('gps-top');
      t.textContent = '⚠ GPS'; t.style.display = '';
      setTimeout(startGPS, 15000); // reintento automático
    },
    { enableHighAccuracy:true, maximumAge:4000, timeout:20000 }
  );
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
const $     = id  => document.getElementById(id);
const svgEl = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);
const pad3  = n   => String(n).padStart(3,'0');

// ═══════════════════════════════════════════════════════════
//  WAKE LOCK
// ═══════════════════════════════════════════════════════════
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => setTimeout(requestWakeLock, 1000));
  } catch(e) {}
}
document.addEventListener('touchstart', requestWakeLock, { once:true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
setInterval(() => { if (!wakeLock || wakeLock.released) requestWakeLock(); }, 30000);

// ═══════════════════════════════════════════════════════════
//  AUTO-UPDATE
// ═══════════════════════════════════════════════════════════
let _lastEtag = null;
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch(location.href, { method:'HEAD', cache:'no-store' });
    const tag = r.headers.get('etag') || r.headers.get('last-modified');
    if (!tag) return;
    if (_lastEtag && tag !== _lastEtag) { location.reload(true); return; }
    _lastEtag = tag;
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
setInterval(checkForUpdate, 60000);
checkForUpdate();

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
drawCompassRose();
buildHoldGeometry();
startGPS();
requestWakeLock();
</script>
